.t-vegas #table{background:radial-gradient(ellipse at 50% 28%,#30a95e,#0e4d29 72%);box-shadow:0 -6px 0 #d4a017,0 -9px 0 #7a5a0a,0 -14px 30px rgba(0,0,0,.45)}
.t-west .card.back::after{background:radial-gradient(ellipse at 50% 50%,#f4e1b0 0 7%,#7a1f15 7.5% 9%,#f4e1b0 9.5% 11%,transparent 11.5%),repeating-linear-gradient(45deg,transparent 0 .045em,rgba(255,230,180,.35) .045em .053em),repeating-linear-gradient(-45deg,transparent 0 .045em,rgba(255,230,180,.35) .045em .053em),linear-gradient(#8a3d1c,#5a250f)}
.t-space .card.back::after{background:radial-gradient(circle at 50% 50%,#39e0ff 0 6%,#0b1a2a 6.5% 9%,#39e0ff 9.5% 10.5%,transparent 11%),repeating-linear-gradient(90deg,transparent 0 .06em,rgba(57,224,255,.25) .06em .066em),repeating-linear-gradient(0deg,transparent 0 .06em,rgba(57,224,255,.25) .06em .066em),linear-gradient(#123a4a,#071a24)}
.t-vegas .card.back::after{background:radial-gradient(ellipse at 50% 50%,#f2c94c 0 8%,#a3101c 8.5% 10%,#f2c94c 10.5% 12%,transparent 12.5%),repeating-linear-gradient(45deg,transparent 0 .04em,rgba(242,201,76,.4) .04em .048em),repeating-linear-gradient(-45deg,transparent 0 .04em,rgba(242,201,76,.4) .04em .048em),linear-gradient(#b3141f,#6e0a12)}
.t-space .plate .nm,.t-space .rbtn{box-shadow:0 0 12px rgba(57,224,255,.35)}
.t-vegas .plate .nm{box-shadow:0 0 0 1.5px #f2c94c,0 3px 10px rgba(0,0,0,.3)}
#scene .tumble{transform:translateX(-150px);animation:tumble 26s linear infinite 3s}@keyframes tumble{0%{transform:translateX(-150px)}35%{transform:translateX(1750px)}100%{transform:translateX(1750px)}}
#scene .spin{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#scene .vult{transform-box:view-box;animation:vult 14s linear infinite}#scene .v2{animation-duration:19s;animation-direction:reverse}@keyframes vult{to{transform:rotate(360deg)}}
#scene .swing{transform-box:view-box;animation:swing 3s ease-in-out infinite alternate}@keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
#scene .tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.1}}
#scene .ufo{transform:translateX(-200px);animation:ufo 30s ease-in-out infinite 4s}@keyframes ufo{0%{transform:translate(-200px,0)}20%{transform:translate(500px,-40px)}35%{transform:translate(1000px,20px)}50%{transform:translate(1800px,-20px)}100%{transform:translate(1800px,-20px)}}
#scene .shoot{transform:translate(1700px,60px);animation:shoot 11s linear infinite 2s;opacity:0}@keyframes shoot{0%{transform:translate(1500px,40px);opacity:0}3%{opacity:1}9%{transform:translate(1000px,210px);opacity:0}100%{transform:translate(1000px,210px);opacity:0}}
.blink1{animation:bl 1.2s steps(2) infinite}.blink2{animation:bl 1.7s steps(2) infinite .3s}.blink3{animation:bl 2.1s steps(2) infinite .6s}@keyframes bl{50%{opacity:.25}}
#scene .beam{transform-box:view-box;animation:beam 7s ease-in-out infinite alternate}#scene .b2{animation-duration:9s;animation-direction:alternate-reverse}@keyframes beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
#scene .bulb{animation:bulb 1.92s linear infinite}@keyframes bulb{0%,30%{opacity:1}31%,100%{opacity:.25}}
#scene .nf1{animation:neon 4s infinite}#scene .nf2{animation:neon 5.3s infinite 1s}#scene .nf3{animation:neon 3.1s infinite .5s}@keyframes neon{0%,40%,44%,48%,100%{opacity:1}42%,46%{opacity:.3}}
.avatar .sparkle{animation:tw 1.6s ease-in-out infinite}
.prop .bub{animation:bub 2s ease-in infinite}@keyframes bub{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.prop .steam{animation:steam 3s ease-in-out infinite}@keyframes steam{50%{transform:translateY(-4px);opacity:.25}}
#rotateHint{display:none}
</style>
</head>
<body>
<div id="stage">
 <div id="scene"></div>
 <div id="table"></div>
 <div class="avatar" id="av1"></div>
 <div class="avatar" id="av2"></div>
 <div class="prop" id="drink1"></div><div class="prop" id="drink2"></div>
 <button class="rbtn" id="btnBack" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
 <div id="title"><div id="tmain">Spiel 1</div></div>
 <div id="gameInfo"></div>
 <div class="plate" id="pl1"><div class="nm"></div><div class="ps"></div></div>
 <div class="plate" id="pl0"><div class="nm"></div><div class="ps"></div></div>
 <div class="plate" id="pl2"><div class="nm"></div><div class="ps"></div></div>
 <button class="rbtn" id="btnMute" aria-label="Ton"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x1" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
 <button class="rbtn" id="btnScore" aria-label="Spielliste"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1-4 4-5.6 7.5-5.6s6.5 1.6 7.5 5.6"/></svg></button>
 <div id="leftIcons">
  <button class="rbtn" id="bLast" aria-label="Letzter Stich"><svg viewBox="0 0 24 24"><path d="M5 14a7.5 7.5 0 0 1 13.5-4.5"/><path d="M19 4.5v5h-5"/><circle cx="12" cy="15" r="1.6" fill="#fff"/></svg></button>
  <button class="rbtn" id="bInfo" aria-label="Regeln"><svg viewBox="0 0 24 24"><path d="M12 10.5v7.5M9.5 18h5M10 10.5h2"/><circle cx="12" cy="6.3" r="1.3" fill="#fff"/></svg></button>
  <button class="rbtn" id="bFast" aria-label="Schnell"><svg viewBox="0 0 24 24"><path d="M3.5 6v12l7.5-6zM11 6v12l7.5-6zM20 6v12" fill="#fff"/></svg></button>
 </div>
 <button class="rbtn" id="btnHint" aria-label="Tipp"><svg viewBox="0 0 24 24"><path d="M9 17.5h6M9.8 20.5h4.4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1 1.3 1 2.2h5.2c0-.9.3-1.6 1-2.2A6 6 0 0 0 12 3z" fill="rgba(255,255,255,.85)" stroke="#fff"/></svg></button>
 <div class="bubble" id="bub0"></div><div class="bubble" id="bub1"></div><div class="bubble" id="bub2"></div>
 <div id="bidUI"><button class="pill" id="bidYes">Ja, 18</button><button class="pill" id="bidNo">Passe</button></div>
 <div id="actionBar"><div class="msg" id="abMsg"></div><button class="pill sm" id="abBtn">Drücken</button></div>
 <div id="open1"></div><div id="open2"></div>
 <div id="cards"></div>
 <div id="toast"></div>
 <div id="overlay"></div>
 <canvas id="fx"></canvas>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const SN=['Karo','Herz','Pik','Kreuz'];
const BASE=[9,10,11,12];
const RANKS=['7','8','9','10','B','D','K','A'];
const PTS={'7':0,'8':0,'9':0,'10':10,'B':2,'D':3,'K':4,'A':11};
const NORM={'7':0,'8':1,'9':2,'D':3,'K':4,'10':5,'A':6};
const NULLO={'7':0,'8':1,'9':2,'10':3,'B':4,'D':5,'K':6,'A':7};
const POSN=['Vorhand','Mittelhand','Hinterhand'];
const params=new URLSearchParams(location.search);
const AUTO=params.has('auto'), TURBO=params.has('turbo');
const DECK=[];for(const s of [0,1,2,3])for(const r of RANKS)DECK.push({s,r,id:r+'_'+s});
function makeBids(){const st=new Set([23,35,46,59]);const bs=[9,10,11,12,24];if(P.cfg.saxon)bs.push(20);const mx=P.cfg.spitze?20:18;for(const b of bs)for(let m=2;m<=mx;m++)st.add(b*m);return [...st].filter(v=>v>=18).sort((a,b)=>a-b)}
let BIDS=[];
const CANDS0=[{type:'suit',trump:3},{type:'suit',trump:2},{type:'suit',trump:1},{type:'suit',trump:0},{type:'grand'}];
const cands=()=>P.cfg.saxon?CANDS0.concat([{type:'saxon'}]):CANDS0;

/* ---------- persistent state ---------- */
const KEY='skat-strand-v1';
let P={scores:[0,0,0],history:[],gameNo:0,dealer:2,date:null,names:['wolfi','Andy','Melli'],won:[0,0,0],lost:[0,0,0],cfg:{}};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.scores)P=Object.assign(P,d);}catch(e){}
if(!P.date)P.date=new Date().toISOString();
P.cfg=Object.assign({theme:'beach',four:false,fast:false,level:1,spitze:true,saxon:true,sfx:true,amb:true,voice:true,music:true},P.cfg||{});BIDS=makeBids();
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const NM=i=>P.names[i];

/* ---------- game state ---------- */
let S={hands:[[],[],[]],skat:[],trick:[],phase:'idle',sel:new Set(),dealer:P.dealer};

/* ---------- helpers ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,TURBO?Math.min(ms,4):ms));
const think=(m=1)=>sleep((P.cfg.fast?280:680)*m);
function shuffle(a){for(let i=a.length-1;i>0;i--){let r;try{r=crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}catch(e){r=Math.random()}const j=Math.floor(r*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const isTrump=(c,g)=>g.type!=='null'&&(c.r==='B'||(g.type==='suit'&&c.s===g.trump));
const eff=(c,g)=>isTrump(c,g)?'T':c.s;
const power=(c,g)=>g.type==='null'?NULLO[c.r]:(c.r==='B'?20+(g.type==='saxon'?3-c.s:c.s):(g.type==='saxon'?6-NORM[c.r]:NORM[c.r]));
function trickWinner(tr,g){const led=eff(tr[0].card,g);let best=0,bs=-9;tr.forEach((t,i)=>{const e=eff(t.card,g);const sc=e==='T'?100+power(t.card,g):(e===led?power(t.card,g):-1);if(sc>bs){bs=sc;best=i}});return best}
function legalMoves(hand,tr,g){if(!tr.length)return hand.slice();const led=eff(tr[0].card,g);const f=hand.filter(c=>eff(c,g)===led);return f.length?f:hand.slice()}
const cardPts=a=>a.reduce((s,c)=>s+PTS[c.r],0);
const gbase=g=>g.type==='grand'?24:g.type==='saxon'?20:BASE[g.trump];
function spitzeCard(g){if(!g)return null;if(g.type==='suit')return DECK.find(c=>c.s===g.trump&&c.r==='7');if(g.type==='grand')return DECK.find(c=>c.s===0&&c.r==='B');if(g.type==='saxon')return DECK.find(c=>c.s===3&&c.r==='B');return null}
const nullVal=g=>g.hand&&g.ouvert?59:g.ouvert?46:g.hand?35:23;
function spitzen(cards,g){const o=g.type==='saxon'?[[0,'B'],[1,'B'],[2,'B'],[3,'B']]:[[3,'B'],[2,'B'],[1,'B'],[0,'B']];if(g.type==='suit')for(const r of ['A','10','K','D','9','8','7'])o.push([g.trump,r]);
 const has=x=>cards.some(c=>c.s===x[0]&&c.r===x[1]);const f=has(o[0]);let n=1;while(n<o.length&&has(o[n])===f)n++;return{n,mit:f}}
function suitColor(s){return P.cfg.four?['#e89a00','#d81e1e','#16883a','#111'][s]:(s<2?'#d3121c':'#1b1b1b')}
function permute(a){if(a.length<=1)return[a];const r=[];a.forEach((x,i)=>{for(const p of permute(a.filter((_,j)=>j!==i)))r.push([x,...p])});return r}
function suitOrder(cards,g){const isN=g&&g.type==='null';const present=s=>cards.some(c=>c.s===s&&(isN||c.r!=='B'));
 const first=(g&&g.type==='suit')?[g.trump]:[];const rest=[3,1,2,0].filter(s=>!first.includes(s)&&present(s));const col=s=>s<2?1:0;
 let best=rest,bsc=99;for(const p of permute(rest)){const seq=first.concat(p);let sc=0;for(let i=1;i<seq.length;i++)if(col(seq[i])===col(seq[i-1]))sc++;if(sc<bsc){bsc=sc;best=p}}return first.concat(best)}
function sortHand(cards,g){g=g||{type:'grand'};const ord=suitOrder(cards,g);const isN=g.type==='null';
 const sx=g.type==='saxon';const key=c=>{if(!isN&&c.r==='B')return sx?100+c.s:100-c.s;return 200+ord.indexOf(c.s)*20-(isN?NULLO[c.r]:sx?6-NORM[c.r]:NORM[c.r])};
 return cards.slice().sort((a,b)=>key(a)-key(b))}
function gameName(g,long){if(!g)return'';let n=g.type==='null'?'Null':g.type==='grand'?'Grand':g.type==='saxon'?'Sächs. Spitze':SN[g.trump];
 if(g.hand)n+=' Hand';if(long!==false){if(g.schwarzA)n+=' Schwarz angesagt';else if(g.schneiderA)n+=' Schneider angesagt'}if(g.ouvert)n+=' Ouvert';if(g.spitze)n+=' Spitze angesagt';return n}

/* ---------- SVG art ---------- */
const SUITPATH={
0:'<path d="M50 3 L91 50 L50 97 L9 50Z"/>',
1:'<path d="M50 93 C22 70 3 55 3 32 C3 15 15 5 29 5 C39 5 46 11 50 20 C54 11 61 5 71 5 C85 5 97 15 97 32 C97 55 78 70 50 93Z"/>',
2:'<path d="M50 3 C40 22 5 40 5 62 C5 76 16 84 28 84 C36 84 42 80 46 74 C44 85 40 91 31 97 L69 97 C60 91 56 85 54 74 C58 80 64 84 72 84 C84 84 95 76 95 62 C95 40 60 22 50 3Z"/>',
3:'<circle cx="50" cy="27" r="21"/><circle cx="26" cy="60" r="21"/><circle cx="74" cy="60" r="21"/><rect x="41" y="36" width="18" height="30"/><path d="M45 55 L55 55 C55 78 60 89 70 97 L30 97 C40 89 45 78 45 55Z"/>'};
const suitSvg=(s,cls='sv')=>`<svg viewBox="0 0 100 100" class="${cls}">${SUITPATH[s]}</svg>`;
const suitIcon=s=>`<span class="gi" style="color:${suitColor(s)}">${suitSvg(s)}</span>`;
const gameIcon=g=>!g?'':g.type==='suit'?suitIcon(g.trump):`<span class="gl">${g.type==='grand'?'G':g.type==='saxon'?'S':'N'}</span>`;
/* realistic French-pattern card faces */
const PIPS={'7':[[30,22],[70,22],[50,48],[30,75],[70,75],[30,128],[70,128]],
 '8':[[30,22],[70,22],[50,48],[30,75],[70,75],[50,102],[30,128],[70,128]],
 '9':[[30,22],[70,22],[30,57.3],[70,57.3],[50,75],[30,92.7],[70,92.7],[30,128],[70,128]],
 '10':[[30,22],[70,22],[50,39.5],[30,57.3],[70,57.3],[30,92.7],[70,92.7],[50,110.5],[30,128],[70,128]]};
const pipG=(s,x,y,sz,rot)=>`<g transform="translate(${x} ${y})${rot?' rotate(180)':''} translate(${-sz/2} ${-sz/2}) scale(${sz/100})">${SUITPATH[s]}</g>`;
function idxAt(c,x){const t=c.r==='10';return `<text x="${x}" y="${t?16.5:17.5}" font-size="${t?13:16}" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700"${t?' letter-spacing="-1.3" textLength="12" lengthAdjust="spacingAndGlyphs"':''}>${c.r}</text>${pipG(c.s,x,26,9.5,false)}`}
function idxG(c){return idxAt(c,8)+idxAt(c,92)}
function courtHalf(r,s,id){
 const pal=[['#c8102e','#1f4e9e','#2e8b3e'],['#1f4e9e','#c8102e','#e8b923'],['#1d6b38','#c8102e','#1f4e9e'],['#26365a','#c8102e','#2e8b3e']][s];
 const [R,R2,R3]=pal,G='#e8b923',GD='#a87b12',L='#2a1a10',SK=`url(#sk${id})`,lw='stroke="'+L+'" stroke-width=".45"';
 let o='';
 // hair behind (queen)
 if(r==='D')o+=`<path d="M40 40 C36 20 64 20 60 40 C62 48 64 54 66 60 L58 55 C59 44 41 44 42 55 L34 60 C36 54 38 48 40 40Z" fill="#d9a43a" ${lw}/><path d="M38 50 q2 -6 2 -12 M62 50 q-2 -6 -2 -12 M36 57 q3 -4 4 -9 M64 57 q-3 -4 -4 -9" stroke="#a87420" stroke-width=".5" fill="none"/>`;
 // robe
 o+=`<path d="M21 75 L22 65 C25 57 33 54 41 53 L59 53 C67 54 75 57 78 65 L79 75Z" fill="url(#rb${id})" ${lw}/>`;
 o+=`<path d="M41 53 L44 75 L56 75 L59 53Z" fill="${R2}" ${lw}/>`;
 o+=`<g fill="${G}" stroke="${GD}" stroke-width=".2">${[58,63,68,73].map(y=>`<path d="M50 ${y-2} l1.6 2 l-1.6 2 l-1.6 -2z"/>`).join('')}</g>`;
 // sleeves / shoulder decoration
 o+=`<path d="M22 66 C26 60 31 58 35 58 L36 63 C31 63 27 66 25 70Z" fill="${R3}" ${lw}/><path d="M78 66 C74 60 69 58 65 58 L64 63 C69 63 73 66 75 70Z" fill="${R3}" ${lw}/>`;
 o+=`<path d="M25 69 L35 61 M27 72 L36 65 M75 69 L65 61 M73 72 L64 65" stroke="${G}" stroke-width=".9"/>`;
 if(r==='K')o+=`<path d="M41 53 L44 75 M59 53 L56 75" stroke="#fff" stroke-width="3.2"/><g fill="#111">${[57,61,65,69,73].map(y=>`<path d="M${41.5+(y-53)*.14} ${y} l.5 1.4 l-.9 0z"/><path d="M${58.5-(y-53)*.14} ${y} l.5 1.4 l-.9 0z"/>`).join('')}</g><path d="M30 56 C36 50 64 50 70 56 L66 58 C60 54 40 54 34 58Z" fill="#fff" ${lw}/><g fill="#111"><circle cx="38" cy="55.5" r=".5"/><circle cx="46" cy="54" r=".5"/><circle cx="54" cy="54" r=".5"/><circle cx="62" cy="55.5" r=".5"/></g>`;
 if(r==='D')o+=`<path d="M42 53 L44 60 L56 60 L58 53Z" fill="${SK}" ${lw}/><g fill="#fff" stroke="#999" stroke-width=".15">${[44,46,48,50,52,54,56].map((x,i)=>`<circle cx="${x}" cy="${57.5+Math.abs(i-3)*-.5+1.5}" r=".8"/>`).join('')}</g>`;
 if(r==='B')o+=`<path d="M44.5 53 L45 75 M47.5 53 L47.8 75 M52.5 53 L52.2 75 M55.5 53 L55 75" stroke="${R3}" stroke-width="1"/><g fill="${G}">${[60,65,70].map(y=>`<circle cx="50" cy="${y}" r=".8"/>`).join('')}</g><path d="M38 54 Q50 59 62 54 L62 56.5 Q50 61 38 56.5Z" fill="#fff" ${lw}/>`;
 // neck + ruff collar (not queen)
 o+=`<path d="M46.5 46 L46.5 54 L53.5 54 L53.5 46Z" fill="${SK}"/>`;
 if(r!=='D')o+=`<path d="M38.5 54.5 Q38.5 50 41.5 51.5 Q43.5 48.6 46 51 Q48 48.4 50 50.8 Q52 48.4 54 51 Q56.5 48.6 58.5 51.5 Q61.5 50 61.5 54.5 Q50 57.5 38.5 54.5Z" fill="#fff" ${lw}/><path d="M42 52 l.6 2.6 M46 51.5 l.2 3 M50 51.2 v3.2 M54 51.5 l-.2 3 M58 52 l-.6 2.6" stroke="#aaa" stroke-width=".3"/>`;
 // head
 o+=`<path d="M42 38 C42 28 58 28 58 38 C58 46 54.5 49.5 50 49.5 C45.5 49.5 42 46 42 38Z" fill="${SK}" ${lw}/>`;
 o+=`<ellipse cx="42" cy="40" rx="1.3" ry="2.2" fill="${SK}" ${lw}/><ellipse cx="58" cy="40" rx="1.3" ry="2.2" fill="${SK}" ${lw}/>`;
 // eyes
 o+=`<path d="M44.6 37.8 Q46.5 36.6 48.4 37.8 Q46.5 39 44.6 37.8Z M51.6 37.8 Q53.5 36.6 55.4 37.8 Q53.5 39 51.6 37.8Z" fill="#fff" stroke="${L}" stroke-width=".3"/><circle cx="46.6" cy="37.8" r=".75" fill="#3a5a8a"/><circle cx="53.6" cy="37.8" r=".75" fill="#3a5a8a"/><circle cx="46.6" cy="37.8" r=".35" fill="#111"/><circle cx="53.6" cy="37.8" r=".35" fill="#111"/>`;
 o+=`<path d="M44.4 35.6 Q46.5 34.4 48.6 35.4 M51.4 35.4 Q53.5 34.4 55.6 35.6" stroke="${r==='K'?'#888':'#6b3d1a'}" stroke-width=".7" fill="none"/>`;
 o+=`<path d="M50 38.5 C49.6 40.5 48.8 42 49 42.6 Q50 43.2 51 42.6" stroke="${L}" stroke-width=".4" fill="none"/><circle cx="45.2" cy="42.6" r="1.7" fill="#f08a8a" opacity=".45"/><circle cx="54.8" cy="42.6" r="1.7" fill="#f08a8a" opacity=".45"/>`;
 if(r==='K'){
  o+=`<path d="M42.3 36 C41 42 41.5 45 43 47 L43.6 38Z M57.7 36 C59 42 58.5 45 57 47 L56.4 38Z" fill="#b8b8b8" ${lw}/>`;

 {const r=S.result,d=r.d;if(d){emote(d,r.won?'happy':'sad',3500);quip(d,r.won?'won':'lost',.85)}[1,2].filter(x=>x!==d).forEach(x=>{emote(x,r.won?'sad':'happy',3500);if(!r.won)quip(x,'beat',.5)})}

 else{showSkat(false);const added=S.skat.map(c=>c.id);S.hands[0]=sortHand(S.hands[0].concat(S.skat));renderHand([L.deck[0],L.deck[1]]);added.forEach(id=>handEls.get(id)&&handEls.get(id).classList.add('newc'));

   await waitInput();$('#actionBar').style.display='none';S.mode=null;
   const disc=S.hands[0].filter(c=>S.sel.has(c.id));S.sel=new Set();S.skatFinal=disc;const keep=S.hands[0].filter(c=>!disc.includes(c));

function panelChoice(title,text,btns){openOverlay(`<div class="panel"><h2>${title}</h2><p style="text-align:center">${text}</p><div class="row">${btns.map((b,i)=>`<button class="pill sm" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`);
 return new Promise(res=>{ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{closeOverlay();res(btns[+b.dataset.i][1])})})}
function valueInfo(g){const cards=g.hand?S.hands[0]:S.hands[0].concat(S.skatFinal);if(g.type==='null'){const v=nullVal(g);return{v,txt:`${gameName(g)} = ${v}`}}
 const sp=spitzen(cards,g);const parts=[`${sp.mit?'mit':'ohne'} ${sp.n}`,`Spiel ${sp.n+1}`];let m=sp.n+1;
 if(g.hand)parts.push(`Hand ${++m}`);if(g.schneiderA){parts.push(`Schneider ${++m}`,`angesagt ${++m}`)}if(g.schwarzA){parts.push(`Schwarz ${++m}`,`angesagt ${++m}`)}if(g.ouvert)parts.push(`Ouvert ${++m}`);if(g.spitze)parts.push(`Spitze ${++m}`,`angesagt ${++m}`);
 return{v:gbase(g)*m,txt:`${parts.join(', ')} → ${m} × ${gbase(g)} = ${gbase(g)*m}${g.hand?' <small>(Skat zählt mit)</small>':''}`}}
function gameChoicePanel(hand){
 const sug=(()=>{let b=null;for(const g of cands()){const st=strength(S.hands[0],g);if(!b||st>b.st)b={st,g}}const u=nullUnsafe(S.hands[0]);if(u.count===0&&nullVal({type:'null',hand})>=S.bid)return{type:'null'};return b.g})();
 let g=Object.assign({hand},sug);
 return new Promise(res=>{
  function draw(){const vi=valueInfo(g);const opts=[['suit',0,'Karo',9],['suit',1,'Herz',10],['suit',2,'Pik',11],['suit',3,'Kreuz',12],['grand',null,'Grand',24]].concat(P.cfg.saxon?[['saxon',null,'Sächs.',20]]:[]).concat([['null',null,'Null',hand?35:23]]);
   const isSel=o=>o[0]===g.type&&(o[0]!=='suit'||o[1]===g.trump);
   let chips='';if(g.type==='null')chips=`<button class="chip${g.ouvert?' sel':''}" data-t="ouvert">Ouvert</button>`;
   else if(hand)chips=['schneiderA:Schneider','schwarzA:Schwarz','ouvert:Ouvert'].map(x=>{const[k,l]=x.split(':');return`<button class="chip${g[k]?' sel':''}" data-t="${k}">${l} angesagt</button>`}).join('').replace('Ouvert angesagt','Ouvert');
   const spc=spitzeCard(g);if(P.cfg.spitze&&spc&&S.hands[0].some(c=>c.id===spc.id))chips+=`<button class="chip${g.spitze?' sel':''}" data-t="spitze">Spitze ansagen (${spc.r==='B'?SN[spc.s]+'-Bube':'Trumpf-7'})</button>`;
   const low=vi.v<S.bid;
   openOverlay(`<div class="panel"><h2>Spiel ansagen · Reizwert ${S.bid}</h2><div class="row">${opts.map((o,i)=>`<button class="gbtn${isSel(o)?' sel':''}" data-o="${i}">${o[0]==='suit'?`<span class="si" style="color:${suitColor(o[1])}">${suitSvg(o[1])}</span>`:`<span class="gl" style="font-size:24px">${o[0]==='grand'?'G':o[0]==='saxon'?'S':'N'}</span>`}${o[2]}<small>${o[3]}</small></button>`).join('')}</div>
   ${chips?`<div class="row">${chips}</div>`:''}<div class="calc">${vi.txt}</div>${low?`<div class="warn">${g.type==='null'?'Null reicht nicht für den Reizwert!':'Unter Reizwert – nur mit Schneider/Schwarz zu retten, sonst überreizt!'}</div>`:''}
   <div class="row">${hand?'':'<button class="pill sm tan" id="gBack">Zurück</button>'}<button class="pill sm" id="gGo" ${low&&g.type==='null'?'disabled':''}>Spielen</button></div></div>`);
   ov.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.o];g={type:o[0],hand};if(o[0]==='suit')g.trump=o[1];S.hands[0]=sortHand(S.hands[0],g);renderHand();draw()});
   ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;g[k]=!g[k];
    if(g.type!=='null'){if(k==='schwarzA'&&g.schwarzA)g.schneiderA=true;if(k==='ouvert'&&g.ouvert)g.schneiderA=g.schwarzA=true;if(k==='schneiderA'&&!g.schneiderA)g.schwarzA=g.ouvert=false;if(k==='schwarzA'&&!g.schwarzA)g.ouvert=false}draw()});
   $('#gGo').onclick=()=>{closeOverlay();res(g)};const bk=$('#gBack');if(bk)bk.onclick=()=>{closeOverlay();res(null)}}
  S.hands[0]=sortHand(S.hands[0],g);renderHand();draw();
  if(AUTO){closeOverlay();res(g)}})}
async function playPhase(){S.leader=(S.dealer+1)%3;S.won=[[],[],[]];S.tricks=[0,0,0];S.voids=[{},{},{}];
 for(let t=0;t<10;t++){S.trickNo=t;updateInfo();S.trick=[];
  for(let i=0;i<3;i++){const seat=(S.leader+i)%3;setTurn(seat);let card;
   if(seat===0&&!AUTO){S.legalSet=new Set(legalMoves(S.hands[0],S.trick,S.game).map(c=>c.id));S.mode='play';renderHand();card=await waitInput();S.mode=null;S.legalSet=null}
   else{await think(i===0?1.1:.9);card=aiPlay(seat)}
   if(!legalMoves(S.hands[seat],S.trick,S.game).includes(card))console.error('illegal move',seat,card);
   if(S.trick.length){const led=eff(S.trick[0].card,S.game);if(eff(card,S.game)!==led)S.voids[seat][led]=true}
   S.hands[seat]=S.hands[seat].filter(c=>c!==card);S.trick.push({seat,card});S.played.push(card);animatePlay(seat,card);renderOpen()}
  setTurn(-1);renderHand();await sleep(P.cfg.fast?550:1050);
  const w=S.trick[trickWinner(S.trick,S.game)].seat;S.won[w].push(...S.trick.map(x=>x.card));S.tricks[w]++;
  S.lastTrick={cards:S.trick.slice(),winner:w};S.trickLog.push({leader:S.leader,cards:S.trick.slice(),winner:w});
  const tp=cardPts(S.trick.map(x=>x.card)),d=S.declarer;
  if(tp>=14){const team=x=>x===d?0:1;[1,2].forEach(x=>{if(team(x)===team(w)){emote(x,'happy');if(x===w)quip(x,'winT',.3)}else{emote(x,'sad');quip(x,'lostT',.2)}})}
  await collectTrick(w);S.leader=w;
  if(S.game.type==='null'&&w===S.declarer)break;if(S.game.schwarzA&&w!==S.declarer)break}
 renderOpen()}
function settle(){const d=S.declarer,g=S.game,base=g.type==='null'?nullVal(g):gbase(g);const skatPts=cardPts(S.skatFinal);
 const declPts=cardPts(S.won[d])+skatPts;const allTaken=S.won.reduce((s,a)=>s+a.length,0);const oppPts=cardPts([].concat(...S.won.filter((_,i)=>i!==d)));
 const dT=S.tricks[d],oT=10-dT-(10-allTaken/3);const oppTricks=S.tricks.reduce((s,v,i)=>i===d?s:s+v,0);
 let r={d,g,declPts,oppPts:oppPts,lines:[],overbid:false};
 if(allTaken===30&&declPts+oppPts!==120)console.error('points mismatch',declPts,oppPts);
 if(g.type==='null'){r.won=dT===0;r.value=base;r.lines=[[gameName(g),base]];r.mult=1}
 else{const sp=spitzen(S.declCards12,g);let m=sp.n+1;r.lines.push([`${sp.mit?'Mit':'Ohne'} ${sp.n}, Spiel`,m]);
  if(g.hand)r.lines.push(['Hand',++m]);
  const schneider=declPts>=90||declPts<=30;const schwarz=oppTricks===0||dT===0;
  if(schneider)r.lines.push(['Schneider',++m]);if(g.schneiderA)r.lines.push(['angesagt',++m]);if(schwarz)r.lines.push(['Schwarz',++m]);if(g.schwarzA)r.lines.push(['angesagt',++m]);if(g.ouvert)r.lines.push(['Ouvert',++m]);{const last=S.trickLog[9];const dc=last&&last.cards.find(x=>x.seat===d);r.spitzeOK=!!(P.cfg.spitze&&last&&last.winner===d&&dc&&dc.card.id===spitzeCard(g).id)}
  if(g.spitze){r.lines.push(['Spitze',++m],['angesagt',++m])}else if(r.spitzeOK){r.lines.push(['Spitze',++m])}
  r.sp=sp;r.mult=m;r.schneider=schneider;r.schwarz=schwarz;r.value=base*m;
  r.won=declPts>=61;if(g.schneiderA&&declPts<90)r.won=false;if(g.schwarzA&&oppTricks>0)r.won=false;if(g.spitze&&!r.spitzeOK)r.won=false;
  if(r.value<S.bid){r.overbid=true;r.won=false;r.value=Math.ceil(S.bid/base)*base}
  r.lines.push([`${gameName({type:g.type,trump:g.trump},false)} ${base} × ${Math.round(r.value/base)} =`,r.value])}
 r.score=r.won?r.value:-2*r.value;S.result=r;
 if(!S.practice){P.scores[d]+=r.score;if(r.won)P.won[d]++;else P.lost[d]++;
  P.history.push({no:P.gameNo,d,g,bid:S.bid,value:r.value,score:r.score,won:r.won,sp:r.sp||null,schneider:!!r.schneider,schwarz:!!r.schwarz,overbid:r.overbid,spitzeOK:!!r.spitzeOK,totals:P.scores.slice(),wl:[P.won.slice(),P.lost.slice()],
   dealt:S.dealt,status:S.status.slice(),declPts,myPts:d===0?declPts:120-declPts-(S.game.type==='null'?0:0),coach:coachText(r),myStatus:S.status[0]});
  P.dealer=(P.dealer+1)%3;save()}
 S.lastDelta=[0,0,0];S.lastDelta[d]=S.practice?0:r.score}

function shareText(){return `Skat am Strand – ${P.names.map((n,i)=>`${n}: ${P.scores[i]}`).join(', ')} nach ${P.history.length} Spielen`}
function newList(){P.scores=[0,0,0];P.history=[];P.won=[0,0,0];P.lost=[0,0,0];P.date=new Date().toISOString();save();updatePlates(S.phase==='done')}
function sheetBody(tab){const dt=new Date(P.date).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
 if(tab==='cur'){if(!S.dealt)return'<p>Noch kein Spiel.</p>';const done=S.phase==='done'||S.phase==='idle';const g=S.game;
  const rows=[0,1,2].map(k=>{const seat=(S.dealer+1+k)%3;const cards=S.dealt.hands[seat].map(id=>DECK.find(c=>c.id===id));const show=seat===0||done;const st=S.status&&S.status[seat]||'';
   return`<div class="prow"><div class="who"><small>${POSN[k]}</small><b>${NM(seat)}</b><br>${st?`<span class="tag${st.startsWith('spielt')?' fill':''}">${st}</span>`:''}</div><div style="font-size:clamp(14px,3.4vh,20px)">${show?mcards(sortHand(cards,g)):'<i>verdeckt</i>'}</div></div>`}).join('');
  return`<div class="row" style="justify-content:flex-end;margin:0 0 8px"><button class="pill sm" id="again" ${done?'':'disabled'}>Erneut spielen</button><button class="pill sm" id="copy">Teilen…</button></div>
   <p>${S.practice?'Übungsspiel':`Spiel ${P.gameNo} aus der Spielliste vom ${dt}`}${g?` · ${gameName(g)}`:''}</p>${rows}${done?`<div class="prow"><div class="who"><b>Skat</b></div><div style="font-size:20px">${mcards(S.dealt.skat.map(id=>DECK.find(c=>c.id===id)))}</div></div>`:''}`}
 if(tab==='list'){const X=b=>b?'X':'';
  const head=`<thead><tr><th class="v" rowspan="2">Spielnummer</th><th class="v" rowspan="2">Grundwert</th><th class="v" rowspan="2">Mit</th><th class="v" rowspan="2">Ohne</th><th class="v" rowspan="2">Hand</th><th class="v" rowspan="2">Schneider</th><th class="v" rowspan="2">– angesagt</th><th class="v" rowspan="2">Schwarz</th><th class="v" rowspan="2">– angesagt</th><th class="v" rowspan="2">Ouvert</th><th class="v" rowspan="2">Sonderregeln</th><th rowspan="2">Spiel-<br>wert</th>${P.names.map(n=>`<th class="pn" colspan="3">${n}</th>`).join('')}</tr>
   <tr>${P.names.map(()=>'<th>Punkte</th><th class="v">Gewonnen</th><th class="v">Verloren</th>').join('')}</tr></thead>`;
  const body=P.history.map(h=>{if(h.passed)return`<tr><td>${h.no}</td><td colspan="11"><i>eingepasst</i></td>${[0,1,2].map(()=>'<td></td><td></td><td></td>').join('')}</tr>`;
   const g=h.g;const nul=g.type==='null';
   return`<tr class="${h.won?'':'lost'}"><td>${h.no}</td><td>${gameIcon(g)}</td><td>${!nul&&h.sp&&h.sp.mit?h.sp.n:''}</td><td>${!nul&&h.sp&&!h.sp.mit?h.sp.n:''}</td><td>${X(g.hand)}</td><td>${X(h.schneider)}</td><td>${X(g.schneiderA)}</td><td>${X(h.schwarz)}</td><td>${X(g.schwarzA)}</td><td>${X(g.ouvert)}</td><td>${[h.overbid?'überreizt':'',g.spitze?'Spitze angesagt':h.spitzeOK?'Spitze':'',g.type==='saxon'?'Sächs.':'',nul?'Null':''].filter(Boolean).join(' ')}</td><td>${h.won?'':'−'}${h.won?h.value:2*h.value}</td>
    ${[0,1,2].map(i=>i===h.d?`<td class="pc">${h.totals[i]}</td><td>${h.won?h.wl[0][i]:''}</td><td>${h.won?'':h.wl[1][i]}</td>`:'<td></td><td></td><td></td>').join('')}</tr>`}).join('')||`<tr><td colspan="21" style="padding:20px">Noch keine Spiele – viel Glück!</td></tr>`;
  return`<table class="list">${head}<tbody>${body}</tbody><tfoot><tr><td colspan="12" style="background:transparent;color:#5b4630;font-size:14px;text-align:right">Spielliste vom ${dt}</td>${P.scores.map(s=>`<td colspan="3">${s}</td>`).join('')}</tr></tfoot></table>
   <div class="row"><button class="pill sm tan" id="newList">Neue Liste</button></div>`}
 const rows=P.history.slice().reverse().map(h=>{const cards=h.dealt.hands[0].map(id=>DECK.find(c=>c.id===id));const my=h.passed?null:(h.d===0?h.declPts:120-h.declPts);
  return`<tr><td>${h.no}</td><td style="font-size:13px">${mcards(sortHand(cards,h.g))}</td><td>${h.myStatus||'gepasst'}</td><td>${h.passed?'–':gameIcon(h.g)}</td><td style="min-width:130px">${my==null?'':`<div class="bar"><i style="width:${my/1.2}%"></i><b style="left:25.8%"></b><b style="left:50.4%"></b><b style="left:75%"></b></div><small>${my} Augen ${h.d===0?'(Allein)':'(Gegenspiel)'}</small>`}</td><td style="text-align:left;font-size:13px;max-width:260px">${h.coach||''}</td></tr>`}).join('');
 return`<p>Coach analysiert deine Spiele – gratis. 🌴</p><table class="list"><thead><tr><th>Nr.</th><th>Deine Karten</th><th>Gereizt bis</th><th>Spiel</th><th>Erzielte Augen<br><small>31 · 61 · 90 · 120</small></th><th>Analyse</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="padding:20px">Noch keine Spiele.</td></tr>'}</tbody></table>`}

/* ---------- menus ---------- */
function openMenu(){const c=P.cfg;const ch=(k,l)=>`<button class="chip${c[k]?' sel':''}" data-k="${k}">${l}</button>`;
 openOverlay(`<div class="panel"><h2>Skat am Strand</h2>
 <div class="row"><button class="pill sm" id="mGo">Weiterspielen</button></div>
 <p class="mh">Thema</p><div class="row">${THEMES.map(([k,l])=>`<button class="chip${curTheme()===k?' sel':''}" data-th="${k}">${l}</button>`).join('')}</div>
 <p class="mh">Spielstärke</p><div class="row">${['Leicht','Gut','Schwer'].map((l,i)=>`<button class="chip${c.level===i?' sel':''}" data-l="${i}">${['🐣','😎','🧠'][i]} ${l}</button>`).join('')}</div>
 <p class="mh">Sonderregeln</p><div class="row">${ch('spitze','Spitze')}${ch('saxon','Sächsische Spitze')}</div>
 <p class="mh">Ton</p><div class="row">${ch('sfx','Kartengeräusche')}${ch('music','Musik')}${ch('amb','Meer & Möwen')}${ch('voice','Stimmen')}</div>
 <p class="mh">Ansicht</p><div class="row">${ch('four','Vierfarbenblatt')}${ch('fast','Schnelles Tempo')}</div>
 <div class="row"><button class="pill sm tan" id="mRules">Regeln</button><button class="pill sm tan" id="mList">Spielliste</button></div>
 <p style="text-align:center;opacity:.7;font-size:13px;margin-top:12px">Tipp: In Safari „Zum Home-Bildschirm“ für Vollbild.<br>Regeländerungen gelten ab dem nächsten Spiel.</p></div>`);
 $('#mGo').onclick=closeOverlay;$('#mRules').onclick=openRules;$('#mList').onclick=()=>openSheet('list');
 ov.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{c.theme=b.dataset.th;save();applyTheme();openMenu()});
 ov.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{c.level=+b.dataset.l;save();openMenu()});
 ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;c[k]=!c[k];save();
  if(k==='four')restyle();if(k==='fast')$('#bFast').classList.toggle('on',c.fast);if(k==='amb'){if(c.amb){ac();startAmbient()}else stopAmbient()}if(k==='music'){if(c.music){ac();startMusic()}else stopMusic()}if(k==='voice'&&!c.voice)try{speechSynthesis.cancel()}catch(e){}
  openMenu()})}
function restyle(){for(const[id,el]of handEls){const c=DECK.find(x=>x.id===id);el.style.color=suitColor(c.s);el.innerHTML=cardSvg(c)}trickEls.forEach(t=>{const c=DECK.find(x=>x.id===t.el.dataset.id);if(c){t.el.style.color=suitColor(c.s);t.el.innerHTML=cardSvg(c)}});renderOpen()}
function openRules(){openOverlay(`<div class="panel rule"><h2>Skatregeln (ISkO)</h2>
<h3>Ziel</h3><p>Der Alleinspieler braucht mindestens <b>61 Augen</b> (Skat zählt für ihn). Kartenwerte: Ass 11, Zehn 10, König 4, Dame 3, Bube 2, 9/8/7 je 0 – zusammen 120.</p>
<h3>Reizen</h3><p>Mittelhand sagt Vorhand (18, 20, 22, 23, 24, 27, 30 …), Vorhand hört („Ja“) oder passt. Danach sagt Hinterhand dem Sieger. Passen alle, darf Vorhand für 18 spielen – sonst eingepasst.</p>
<h3>Spiele & Grundwerte</h3><p>Karo 9 · Herz 10 · Pik 11 · Kreuz 12 · Grand 24. Null 23 · Null Hand 35 · Null Ouvert 46 · Null Ouvert Hand 59.</p>
<h3>Spielwert</h3><p>Grundwert × Stufen: mit/ohne Spitzen + Spiel 1 + Hand + Schneider + angesagt + Schwarz + angesagt + Ouvert. Liegt der Spielwert unter dem Reizwert, ist das Spiel <b>überreizt</b> und verloren.</p>
<h3>Schneider & Schwarz</h3><p>Schneider: eine Partei hat höchstens 30 Augen. Schwarz: eine Partei bekommt keinen Stich. Ansagen nur bei Handspielen.</p>
<h3>Trumpf & Bedienen</h3><p>Buben sind immer die höchsten Trümpfe (♣ ♠ ♥ ♦), im Farbspiel folgt die Trumpffarbe A 10 K D 9 8 7. Im Grand nur Buben. Im Null kein Trumpf, Reihenfolge A K D B 10 9 8 7 – der Alleinspieler darf keinen Stich bekommen. Farbe muss bedient werden.</p>
<h3>Wertung</h3><p>Gewonnen: + Spielwert. Verloren: − doppelter Spielwert (nur beim Alleinspieler).</p>
<h3>Sonderregel: Spitze</h3><p>Wer den niedrigsten Trumpf hält (Trumpf-7 im Farbspiel, Karo-Bube im Grand, Kreuz-Bube in der Sächsischen Spitze), darf „mit Spitze“ ansagen: Er muss den <b>letzten Stich mit genau dieser Karte</b> machen. Macht der Alleinspieler den letzten Stich mit dieser Karte, zählt <b>Spitze +1</b> – automatisch, auch ohne Ansage. Wer die Spitze vorher <b>ansagt</b>, bekommt <b>Spitze + angesagt = +2</b>; klappt es dann nicht, ist das Spiel verloren. Hand oder mit Skat erlaubt.</p>
<h3>Sonderregel: Sächsische Spitze</h3><p>Ein „umgedrehter Grand“, Grundwert 20: nur Buben sind Trumpf, aber in umgekehrter Reihenfolge – <b>Karo-Bube ist der höchste</b>, dann Herz, Pik, Kreuz. In den Farben sticht die <b>7 am höchsten</b>: 7 8 9 D K 10 A. Die Augen der Karten bleiben gleich. Spitzen zählen vom Karo-Buben abwärts.</p>
<h3>Spielstärke</h3><p>🐣 Leicht: Gegner machen öfter Fehler und reizen wild. 😎 Gut: solide Kneipenspieler. 🧠 Schwer: Gegner zählen Karten und simulieren hunderte mögliche Kartenverteilungen vor jedem Zug (auch der 💡-Tipp nutzt das).</p>
<h3>Bedienung</h3><p>Karte antippen zum Ausspielen · 💡 Tipp · ↻ letzter Stich · ⏩ Tempo · 👤 Spielliste & Coach.</p>
<div class="row"><button class="pill sm" id="rOk">OK</button></div></div>`);$('#rOk').onclick=closeOverlay}
function showLast(){if(!S.lastTrick){toast('Noch kein Stich');return}const t=S.lastTrick;openOverlay(`<div class="panel"><h2>Letzter Stich – ${NM(t.winner)}</h2><div class="row" style="font-size:26px">${t.cards.map(x=>`<div style="text-align:center">${mcards([x.card])}<div style="font-size:14px">${NM(x.seat)}</div></div>`).join('')}</div><p style="text-align:center">${cardPts(t.cards.map(x=>x.card))} Augen</p><div class="row"><button class="pill sm" id="lOk">OK</button></div></div>`);$('#lOk').onclick=closeOverlay}
function hint(){
 if(S.bidAsk){const m=S.coach.max;toast(m?`Coach: reizen bis ${m} (${gameName(S.coach.game)})`:'Coach: lieber passen');bubble(0,m>=S.bidAsk.val?'👍':'👎',1200);return}
 if(S.mode==='discard'){const all=S.hands[0];const save=S.hands[0];S.hands[0]=all.filter(c=>!S.skat.includes(c));const ch=aiDeclareFor12(all);S.hands[0]=save;S.sel=new Set(ch.disc.map(c=>c.id));renderHand();$('#abBtn').disabled=false;$('#abMsg').textContent=`Coach: drücken für ${gameName(ch.game)}`;return}
 if(S.mode==='play'){const c=aiPlay(0,true);S.hintId=c.id;renderHand();return}
 toast('Tipp gibt’s wenn du dran bist')}
function aiDeclareFor12(all){let best=null;for(let i=0;i<12;i++)for(let j=i+1;j<12;j++){const kept=all.filter((_,k)=>k!==i&&k!==j);const disc=[all[i],all[j]];
 for(const g of cands()){if(disc.some(c=>c.r==='B'))continue;const st=strength(kept,g)+cardPts(disc)*.03-(g.type!=='suit'?6.9:7);const v=gbase(g)*(spitzen(all,g).n+1);const sc=st+(v>=S.bid?5:0);if(!best||sc>best.sc)best={sc,game:g,disc}}}return best}
$('#btnBack').onclick=openMenu;$('#btnScore').onclick=()=>openSheet(S.phase==='done'?'cur':'list');$('#bInfo').onclick=openRules;$('#bLast').onclick=showLast;$('#btnHint').onclick=hint;
function setMute(m){P.cfg.muted=m;save();$('#btnMute').classList.toggle('off',m);if(MASTER&&AC)MASTER.gain.setTargetAtTime(m?0:.9,AC.currentTime,.05);if(m){stopAmbient();stopMusic();try{speechSynthesis.cancel()}catch(e){}}else{ac();startAmbient();startMusic()}}
$('#btnMute').onclick=()=>setMute(!P.cfg.muted);
$('#bFast').onclick=()=>{P.cfg.fast=!P.cfg.fast;save();$('#bFast').classList.toggle('on',P.cfg.fast);$('#btnMute').classList.toggle('off',!!P.cfg.muted);toast(P.cfg.fast?'Schnelles Tempo':'Normales Tempo',900)};

/* ---------- boot ---------- */
$('#stage').addEventListener('scroll',e=>{e.target.scrollTop=0;e.target.scrollLeft=0});applyTheme(true);$('#bFast').classList.toggle('on',P.cfg.fast);
addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(layout,120)});
layout();
window.__S=S;window.__P=P;window.__errors=[];
(async function main(){updatePlates();if(!P.seen&&!AUTO){P.seen=true;save();openRules();await new Promise(r=>{$('#rOk').onclick=()=>{closeOverlay();r()}})}
 while(true){try{await playGame()}catch(e){console.error(e);window.__errors.push(String(e&&e.stack||e));await sleep(1000)}}})();
</script>
</body>
