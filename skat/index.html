 ['1.18.1','2026-11-05','👥 Mehrspieler stabiler: Tisch öffnet nach Hintergrund/Neuladen automatisch wieder mit demselben Link · Gast sucht bis zu 2 Minuten nach dem Tisch statt sofort aufzugeben · klarere Fehlermeldungen'],

 ['1.17.9','2026-11-04','🏆 Highscores: deine 10 besten Spiele, beste Liste, Ewige Tabelle und letzte Listen bleiben gespeichert – auch nach neuer Liste · 5 neue Erfolge · Eigener Stich schwingt zu dir nach unten statt auf einen Stapel neben Andy'],

 ['1.17.7','2026-11-03','Coach im Ramsch korrigiert (jeder spielt für sich) · Bock/Ramsch-Leiste rechts: gespielte Runden durchgestrichen, aktuelle leuchtet · Punktestand unter jedem Namen'],

 ['1.17.2','2026-11-03','Keine Augen mehr während des Spiels: Stichstapel, letzter Stich und Coach-Tipps zeigen erst am Ende Punkte'],

 ['1.16.3','2026-11-03','Lustige Kartenrückseiten passend zum Thema: Krabbe mit Sonnenbrille (Strand), Kaktus-Steckbrief (Western), UFO entführt Kuh (Weltraum), grinsende Würfel (Vegas)'],

 ['1.16.0','2026-11-03','Neun neue Hintergrund-Klangwelten (Regen & Gewitter, Lagerfeuer, Biergarten, Dschungel, Bauernhof, Unterwasser, Café, Zug, Meer) mit Lautstärkeregler · Eigene Fotos für Andy und Melli · Eigene Stimmen aufnehmen oder als Datei laden, mit Effekten (Mickymaus, Bär, Echo, Funk, Halle) · Dialekt „Bayrisch + Badisch“ · Wärmere Stimmen · Größere, schönere Karten'],
 ['1.15.4','2026-11-02','Fix: Spielnummer zählt jetzt genau die Spiele der Liste (nach Neuladen oder Wiederholen lief sie davon) · Liste endet sicher nach der eingestellten Anzahl'],

  status:[0,1,2].map(v=>(S.status||[])[R(v)]||''),tricks:[0,1,2].map(v=>(S.tricks||[0,0,0])[R(v)]||0),won:[0,1,2].map(v=>ids((S.won||[[],[],[]])[R(v)])),
  trickNo:S.trickNo||0,kontraBy:V(S.kontraBy),re:!!S.re,bock:!!S.bock,schiebCount:S.schiebCount||0,leader:V(S.leader),
  names:[0,1,2].map(v=>NM(R(v))),scores:[0,1,2].map(v=>P.scores[R(v)]),skatOn:skatEls.length>0,turn:V(NET.turn),gameNo:P.gameNo||0}}
function mpSyncNow(seat){const c=NET.conns[seat];if(!c)return;try{c.send({t:'st',v:mpView(seat)})}catch(e){}}
function mpSync(seat){if(seat!=null)return mpSyncNow(seat);if(NET.role!=='host')return;clearTimeout(NET.syncT);NET.syncT=setTimeout(()=>{for(const s of [1,2])mpSyncNow(s)},30)}
function mpEv(e,o){if(NET.role!=='host')return;for(const s of [1,2]){const c=NET.conns[s];if(!c)continue;const V=r=>(r==null||r<0)?-1:(r-s+3)%3;const m=Object.assign({t:'ev',e},o);if('seat' in m)m.seat=V(m.seat);try{c.send(m)}catch(x){}}}
/* Hooks: Spielablauf an die Gäste melden */
{const _st=setTurn;setTurn=function(seat){NET.turn=seat;_st(seat);mpSync()};
 const _ui=updateInfo;updateInfo=function(){_ui();mpSync()};
 const _rh=renderHand;renderHand=function(sp){_rh(sp);mpSync()};
 const _ss=showSkat;showSkat=function(on){_ss(on);mpSync()};
 const _ap=animatePlay;animatePlay=function(seat,card){mpEv('play',{seat,id:card.id});_ap(seat,card)};
 const _ct=collectTrick;collectTrick=function(w){mpEv('collect',{seat:w});return _ct(w)};
 const _bu=bubble;bubble=function(seat,txt,ms){_bu(seat,txt,ms);mpEv('bub',{seat,txt:String(txt),ms:ms||1500})};
 const _da=dealAnim;dealAnim=function(){mpEv('deal',{});return _da()};
 const _sr=showResult;showResult=function(){mpEv('res',{txt:mpResText()});mpSync();return _sr()};
 const _sy=say;say=function(seat,t){if(isRem(seat))return;_sy(seat,t)};
 const _qu=quip;quip=function(seat,k,p){if(isRem(seat))return;_qu(seat,k,p)};
 const _sa=sayAnswer;sayAnswer=function(seat,yes){if(isRem(seat)){bubble(seat,yes?'Ja':'Passe',1400);return}_sa(seat,yes)};
 const _em=emote;emote=function(seat,k,ms){if(isRem(seat))return;_em(seat,k,ms)}}
function mpResText(){const r=S.result;if(!r)return'';try{
 if(r.ramsch){if(r.durch!==undefined)return`${NM(r.durch)} macht Durchmarsch! (+${r.value})`;return`Ramsch: ${r.losers.map(NM).join(' & ')} verliert (${r.value})`}
 const sc=r.score>0?'+'+r.score:String(r.score);return`${NM(r.d)} ${r.won?'gewinnt':'verliert'} ${gameName(r.g||S.game)}${r.declPts!=null?' mit '+r.declPts+' Augen':''} · ${sc}`}catch(e){return''}}
async function remoteDeclare(d){const r=await rAsk(d,'declare',{hand:S.hands[d].map(c=>c.id),skat:S.skat.map(c=>c.id),bid:S.bid},()=>null);
 const all=S.hands[d].concat(S.skat);const disc=r&&r.game&&!r.game.hand?all.filter(c=>(r.disc||[]).includes(c.id)):null;
 if(!r||!r.game||(!r.game.hand&&(!disc||disc.length!==2))){await aiDeclarePhase(d);return}
 if(r.game.hand){S.skatFinal=S.skat.slice();bubble(d,'Hand!',900)}else{S.hands[d]=all.filter(c=>!disc.includes(c));S.skatFinal=disc;bubble(d,'Skat',900)}
 showSkat(false);await sleep(500);S.game=r.game;bubble(d,gameName(S.game),1800)}
/* Tisch nach Hintergrund/Neuladen wieder öffnen (iPhone pausiert Apps im Hintergrund) */
async function mpWake(){if(JOIN||NET.role==='guest')return;if(NET.role==='host'&&NET.peer){if(NET.peer.destroyed){NET.peer=null;NET.role=null;try{await mpHost(NET.room);toast('👥 Tisch ist wieder offen',1600)}catch(e){}}else if(NET.peer.disconnected){try{NET.peer.reconnect()}catch(e){}}return}
 const sv=mpSaved();if(sv&&!NET.role){try{await mpHost(sv.id);toast('👥 Dein Mehrspieler-Tisch ist wieder offen',2200)}catch(e){}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(mpWake,300)});
addEventListener('pageshow',()=>setTimeout(mpWake,300));
/* Host-Panel */
function mpPanelRefresh(){if(document.getElementById('mpPanel'))openMp()}
async function openMp(){const seatRow=s=>`<div class="strow"><span>${['','🦀 Platz von Andy','💖 Platz von Melli'][s]}</span><b>${NET.conns[s]?'📱 '+NET.names[s]:'🤖 KI'}</b></div>`;
 const on=NET.role==='host'&&NET.room;
 openOverlay(`<div class="panel" id="mpPanel"><h2>👥 Mehrspieler</h2>
 <p style="text-align:center">Lade bis zu zwei Freunde ein. Sie übernehmen den Platz von Andy oder Melli und spielen auf ihrem eigenen Handy mit. Freie Plätze spielt weiter die KI.</p>
 ${on?`<p class="mh" style="text-align:center">Einladungslink</p><div style="word-break:break-all;background:rgba(0,0,0,.08);padding:8px 10px;border-radius:10px;font:13px ui-monospace,monospace;user-select:text;-webkit-user-select:text">${mpLink()}</div>
 <div class="row" style="margin-top:8px">${navigator.share?'<button class="pill sm" id="mpShare">📤 Teilen</button>':''}<button class="pill sm tan" id="mpCopy">📋 Kopieren</button></div>
 <p class="mh" style="text-align:center;margin-top:12px">Am Tisch</p><div class="strow"><span>🏖️ Du</span><b>${NM(0)}</b></div>${seatRow(1)}${seatRow(2)}
 <p style="text-align:center;font-weight:700">${NET.ok&&NET.peer&&!NET.peer.disconnected?'🟢 Tisch ist offen':'🟠 Verbindung zum Server weg – verbinde neu …'}</p>
 <p class="hd" style="text-align:center">Wichtig auf dem iPhone: Nach dem Teilen <b>gleich zurück in die App</b> wechseln und sie offen lassen. Solange die App im Hintergrund ist, ist der Tisch zu und der Freund sieht „Tisch nicht gefunden“. Der Link bleibt gültig, er kann es dann einfach nochmal probieren.</p>
 <div class="row"><button class="pill sm tan" id="mpEnd">Mehrspieler beenden</button><button class="pill sm" id="mpOk">Weiterspielen</button></div>`
 :`<div class="row"><button class="pill sm" id="mpStart">📨 Freund einladen</button></div><div class="row"><button class="pill sm tan" id="mpOk">Zurück</button></div>`}</div>`);
 const q=id=>document.getElementById(id);
 if(q('mpStart'))q('mpStart').onclick=async()=>{q('mpStart').disabled=true;q('mpStart').textContent='Verbinde …';try{await mpHost();openMp()}catch(e){toast(`Mehrspieler-Server nicht erreichbar (${e&&e.type||e&&e.message||'?'}) – Internet prüfen und nochmal versuchen`,3500);openMp()}};
 if(q('mpShare'))q('mpShare').onclick=()=>navigator.share({title:'Skat am Strand',text:`${NM(0)} lädt dich zu einer Runde Skat ein 🃏`,url:mpLink()}).catch(()=>{});
 if(q('mpCopy'))q('mpCopy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(mpLink()):Promise.reject()).then(()=>toast('Link kopiert',1200)).catch(()=>toast('Link markieren und kopieren',1600))};
 if(q('mpEnd'))q('mpEnd').onclick=()=>{mpStop();openMp()};
 q('mpOk').onclick=()=>closeOverlay()}
/* ---- Gast ---- */
function mpApply(v){NET.view=v;if(NET.busy||NET.dealing)return;
 const H=x=>Array.isArray(x)?x.map(MPC).filter(Boolean):Array.from({length:x},(_,i)=>({id:'hid'+i,s:0,r:'7',hid:1}));
 Object.assign(S,{hands:v.hands.map(H),game:v.game,bid:v.bid,phase:v.phase,status:v.status,dealer:v.dealer,declarer:v.declarer,tricks:v.tricks,won:v.won.map(a=>a.map(MPC)),
  trickNo:v.trickNo,kontraBy:v.kontraBy,re:v.re,bock:v.bock,schiebCount:v.schiebCount,leader:v.leader});
 NET.vnames=v.names;P.scores=v.scores;P.gameNo=v.gameNo;S.hands[0]=S.game?sortHand(S.hands[0],S.game):sortHand(S.hands[0]);
 if(!NET.collecting)mpTrickSync(v.trick);
 if(v.skatOn!==skatEls.length>0)showSkat(v.skatOn);
 setTurn(v.turn);updatePlates();updateInfo();renderHand();renderOpen();renderPile()}
function mpTrickSync(tr){const cur=trickEls.map(t=>t.seat+':'+t.id).join(),want=tr.map(t=>t.seat+':'+t.id).join();if(cur===want)return;
 trickEls.forEach(t=>t.el.remove());trickEls=[];tr.forEach((t,i)=>{const c=MPC(t.id);if(!c)return;const el=makeCardEl(c);el.style.pointerEvents='none';el.style.zIndex=300+i;layer.appendChild(el);const sl=L.slots[t.seat];setT(el,sl[0],sl[1],sl[2],L.ts);trickEls.push({el,seat:t.seat,id:t.id})})}
async function mpGuestEv(m){
 if(m.e==='play'){const c=MPC(m.id);if(!c||trickEls.some(t=>t.id===m.id))return;if(m.seat===0){S.hands[0]=S.hands[0].filter(x=>x.id!==m.id)}animatePlay(m.seat,c);trickEls[trickEls.length-1].id=m.id}
 else if(m.e==='collect'){NET.collecting=true;try{await collectTrick(m.seat)}finally{NET.collecting=false;if(NET.view)mpApply(NET.view)}}
 else if(m.e==='bub')bubble(m.seat,m.txt,m.ms);
 else if(m.e==='deal'){NET.dealing=true;closeOverlay();hideBubbles();clearTable();try{await dealAnim()}finally{NET.dealing=false;if(NET.view){mpApply(NET.view)}}}
 else if(m.e==='res'){updatePlates(true);if(m.txt)openOverlay(`<div class="panel"><h2>Spielende</h2><p style="text-align:center;font-size:17px">${m.txt}</p>${[0,1,2].map(i=>`<div class="strow"><span>${NM(i)}</span><b>${P.scores[i]}</b></div>`).join('')}<p class="hd" style="text-align:center">${NM(NET.hostSeatV)} gibt das nächste Spiel.</p><div class="row"><button class="pill sm" id="mpRok">OK</button></div></div>`),document.getElementById('mpRok').onclick=()=>closeOverlay()}}
async function mpGuestAsk(m){const{id,kind,data}=m;let v=null;
 try{if(kind==='bid')v=await humanBid(data.mode,data.val);
  else if(kind==='yn'){if(data.msg)toast(data.msg,2800);v=await humanAsk(data.yes,data.no)}
  else if(kind==='play'){S.legalSet=new Set(data.legal);S.mode='play';renderHand();let c;do{c=await waitInput()}while(!c||typeof c!=='object');S.mode=null;S.legalSet=null;renderHand();v=c.id}
  else if(kind==='declare'){NET.busy=true;S.hands[0]=sortHand(data.hand.map(MPC));S.skat=data.skat.map(MPC);S.bid=data.bid;S.declarer=0;S.skatFinal=null;S.game=null;renderHand();showSkat(true);
   await humanDeclare();v={game:S.game,disc:(S.skatFinal||[]).map(c=>c.id)};NET.busy=false}}
 catch(e){console.error(e);NET.busy=false}
 try{NET.conn.send({t:'ans',id,v})}catch(e){}if(NET.view)mpApply(NET.view)}
async function mpGuest(){save=function(){};document.body.classList.add('mpGuest');
 let auto=null;try{auto=sessionStorage.getItem('skatMpAuto')&&localStorage.getItem('skatMpName');sessionStorage.removeItem('skatMpAuto')}catch(e){}
 const name=auto||await new Promise(res=>{openOverlay(`<div class="panel"><h2>🃏 Skat am Strand</h2><p style="text-align:center">Du wurdest zu einer Runde Skat eingeladen!</p><p class="mh" style="text-align:center">Dein Name</p>
  <input id="mpName" maxlength="14" value="${(localStorage.getItem('skatMpName')||'').replace(/"/g,'')}" placeholder="Name" style="width:100%;font:18px system-ui;padding:10px;border-radius:10px;border:1px solid #bba;-webkit-user-select:text;user-select:text">
  <div class="row" style="margin-top:10px"><button class="pill sm" id="mpJoin">Mitspielen</button></div></div>`);
  const go=()=>{const n=document.getElementById('mpName').value.trim()||'Gast';try{localStorage.setItem('skatMpName',n)}catch(e){}res(n)};document.getElementById('mpJoin').onclick=go;document.getElementById('mpName').onkeydown=e=>{if(e.key==='Enter')go()}});
 const stat=(n,why)=>openOverlay(`<div class="panel"><h2>Suche den Tisch …</h2><p style="text-align:center">${why||'Einen Moment.'}</p><p class="hd" style="text-align:center">Versuch ${n} · Der Gastgeber muss Skat am Strand gerade <b>offen</b> haben (nicht im Hintergrund).</p></div>`);
 let last='';stat(1);
 try{await mpLoadPeer()}catch(e){last='script'}
 if(last!=='script'){const t0=Date.now();
  for(let n=1;Date.now()-t0<120000;n++){
   try{if(!NET.peer||NET.peer.destroyed||NET.peer.disconnected){try{NET.peer&&NET.peer.destroy()}catch(x){}NET.peer=new Peer(mpOpts());const pr=NET.peer;await new Promise((res,rej)=>{pr.on('open',res);pr.on('error',rej);setTimeout(()=>rej({type:'server-timeout'}),12000)})}
    const pr=NET.peer;const c=pr.connect(JOIN,{reliable:true});
    await new Promise((res,rej)=>{let done=0;const ok=()=>{if(!done){done=1;res()}},no=e=>{if(!done){done=1;rej(e)}};c.on('open',ok);c.on('error',no);pr.once('error',no);setTimeout(()=>no({type:'no-answer'}),12000)});
    NET.conn=c;NET.role='guest';last='';break}
   catch(e){last=(e&&e.type)||'?';try{NET.peer&&NET.peer.off&&NET.peer.off('error')}catch(x){}
    stat(n+1,last==='peer-unavailable'?'Der Tisch ist gerade nicht erreichbar – wahrscheinlich ist die App beim Gastgeber im Hintergrund. Ich versuche es weiter …':last==='no-answer'?'Der Tisch antwortet nicht – evtl. blockiert das WLAN die Verbindung. Ich versuche es weiter …':'Ich versuche es weiter …');
    if(last==='peer-unavailable'||last==='network'||last==='server-timeout'){try{NET.peer.destroy()}catch(x){}NET.peer=null}await sleep(3000)}}}
 if(NET.role!=='guest'){const tip=last==='script'?'Die Mehrspieler-Bibliothek ließ sich nicht laden – Internetverbindung prüfen.':last==='no-answer'?'Der Tisch wurde gefunden, aber die direkte Verbindung klappt nicht. Probier es im Handynetz statt im WLAN (oder umgekehrt).':'Der Gastgeber muss die App offen haben, nicht im Hintergrund. Sag ihm, er soll zurück in Skat am Strand wechseln.';
  openOverlay(`<div class="panel"><h2>Tisch nicht gefunden</h2><p style="text-align:center">${tip}</p><p class="hd" style="text-align:center">Fehlercode: ${last||'?'}</p><div class="row"><button class="pill sm" id="mpRe">Nochmal</button></div></div>`);document.getElementById('mpRe').onclick=()=>location.reload();return}
 const q=[];let busy=false;const pump=async()=>{if(busy)return;busy=true;while(q.length){const m=q.shift();try{if(m.t==='ev')await mpGuestEv(m)}catch(e){console.error(e)}}busy=false};
 NET.conn.on('data',m=>{if(!m||typeof m!=='object')return;
  if(m.t==='st'){if(NET.view==null){closeOverlay();toast(`Du bist am Tisch! 🏖️`,2000)}NET.hostSeatV=(3-(NET.seat||1))%3;mpApply(m.v)}
  else if(m.t==='seat'){NET.seat=m.seat;const t=curTheme();[1,2].forEach(v=>{const r=(v+m.seat)%3;$('#av'+v).innerHTML=r?avatarSvg(r,t):''})}
  else if(m.t==='ask')mpGuestAsk(m);
  else if(m.t==='ping'){try{NET.conn.send({t:'pong'})}catch(e){}}
  else if(m.t==='ev'){if(m.e==='play'||m.e==='bub'){mpGuestEv(m)}else{q.push(m);pump()}}
  else if(m.t==='full'){openOverlay('<div class="panel"><h2>Tisch ist voll</h2><p style="text-align:center">Es spielen schon drei Leute.</p></div>')}
  else if(m.t==='end'){NET.ended=true;openOverlay('<div class="panel"><h2>Runde beendet</h2><p style="text-align:center">Der Gastgeber hat die Mehrspieler-Runde beendet. Danke fürs Mitspielen!</p></div>')}});
 NET.conn.on('close',()=>{if(NET.left||NET.ended)return;openOverlay('<div class="panel"><h2>Verbindung weg</h2><p style="text-align:center">Die Verbindung zum Gastgeber ist abgerissen – ich verbinde neu …</p></div>');try{sessionStorage.setItem('skatMpAuto','1')}catch(e){}setTimeout(()=>location.reload(),2500)});
 NET.conn.send({t:'hello',name});addEventListener('pagehide',()=>{try{NET.conn.send({t:'bye'})}catch(e){}});
 $('#btnBack').onclick=()=>{openOverlay(`<div class="panel"><h2>👥 Mehrspieler</h2><p style="text-align:center">Du spielst am Tisch von ${NM(NET.hostSeatV)}.</p><div class="row"><button class="pill sm tan" id="mpLeave">Verlassen</button><button class="pill sm" id="mpStay">Weiterspielen</button></div></div>`);
  document.getElementById('mpStay').onclick=()=>closeOverlay();document.getElementById('mpLeave').onclick=()=>{NET.left=true;try{NET.conn.send({t:'bye'})}catch(e){}setTimeout(()=>{location.href=location.pathname},300)}};
 openOverlay('<div class="panel"><h2>Verbunden ✅</h2><p style="text-align:center">Warte auf das nächste Spiel …</p></div>')}

(async function main(){if(JOIN&&!AUTO){updatePlates();await mpGuest();return}updatePlates();if(!AUTO&&mpSaved())setTimeout(mpWake,1500);if(!P.seen&&!AUTO){P.seen=true;save();await new Promise(r=>openRules(r))}
 while(true){try{if(P.history.length>=(P.cfg.listLen||12))await listEnd();await playGame();if(!S.practice&&P.history.length>=(P.cfg.listLen||12))await listEnd()}catch(e){console.error(e);window.__errors.push(String(e&&e.stack||e));await sleep(1000)}}})();
