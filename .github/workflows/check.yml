name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check_site.mjs
      - run: node --check app.js && node --check data.js && node --check version.js && node --check sw.js
      - run: python -c "import json; json.load(open('news.json')); json.load(open('manifest.webmanifest'))"
