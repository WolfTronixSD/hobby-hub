<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Wolfie the wolf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f43"/><stop offset="1" stop-color="#5b78ff"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef7"/><stop offset="1" stop-color="#9fb0c8"/></linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- ears -->
  <polygon points="17,8 40,30 21,46" fill="#3a4660"/>
  <polygon points="83,8 60,30 79,46" fill="#3a4660"/>
  <polygon points="21,17 34,30 24,40" fill="#ffb3a7"/>
  <polygon points="79,17 66,30 76,40" fill="#ffb3a7"/>
  <!-- head -->
  <polygon points="21,32 50,24 79,32 90,54 70,70 58,92 42,92 30,70 10,54" fill="#55627e"/>
  <polygon points="10,54 30,70 26,56" fill="#3a4660"/>
  <polygon points="90,54 70,70 74,56" fill="#3a4660"/>
  <!-- face mask -->
  <polygon points="50,36 67,54 60,90 40,90 33,54" fill="url(#fur)"/>
  <polygon points="26,52 40,48 33,60" fill="url(#fur)"/>
  <polygon points="74,52 60,48 67,60" fill="url(#fur)"/>
  <!-- eyes -->
  <polygon points="31,47 43,50 35,55" fill="#ffd23f"/>
  <polygon points="69,47 57,50 65,55" fill="#ffd23f"/>
  <circle cx="37" cy="51" r="1.9" fill="#111"/>
  <circle cx="63" cy="51" r="1.9" fill="#111"/>
  <!-- nose and grin -->
  <polygon points="43,76 57,76 50,84" fill="#1b2233"/>
  <path d="M42,85 Q50,91 58,85" fill="none" stroke="#1b2233" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="52,86 56,86 54,92" fill="#ff6b81"/>
</svg>
