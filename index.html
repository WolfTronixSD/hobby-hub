<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hobby Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1.3.1">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="logo">⚡</span>
      <div>
        <h1>Hobby Hub <button class="ver" id="versionBtn" aria-label="Version history"></button></h1>
        <p class="sub">Podcasts, YouTube and news for the road</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark">🌙</button>
  </header>

  <nav class="hobbies" id="hobbyNav" aria-label="Hobbies"></nav>

  <nav class="tabs" id="tabNav" aria-label="Sections">
    <button data-tab="podcasts"><span>🎧</span>Podcasts</button>
    <button data-tab="youtube"><span>▶️</span>YouTube</button>
    <button data-tab="news"><span>📰</span>News</button>
  </nav>

  <main id="content" tabindex="-1"></main>

  <footer class="foot">
    <span id="updated"></span>
    <button class="linkish" id="historyLink">Version history</button>
    <a href="https://github.com/WolfTronixSD/hobby-hub">Source on GitHub</a>
  </footer>

  <script src="version.js?v=1.3.1"></script>
  <script src="data.js?v=1.3.1"></script>
  <script src="app.js?v=1.3.1"></script>
</body>
</html>
