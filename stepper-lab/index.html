<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WolfTronix Stepper Lab</title>
<style>
:root{--bg:#0d1117;--pn:#161b22;--pn2:#1c232d;--ln:#2a3340;--tx:#d6dde6;--dim:#8b96a3;--amb:#f5a524;--cy:#39c5cf;--gr:#3fb950;--rd:#f85149;--vi:#a371f7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--amb)}
header .sub{color:var(--dim);font-size:12px}
header .sp{flex:1}
button{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:var(--amb)}
button.on{background:#3a2a08;border-color:var(--amb);color:#ffd27a}
#app{display:grid;grid-template-columns:190px 1fr 290px;height:calc(100% - 51px)}
nav{border-right:1px solid var(--ln);overflow:auto;padding:8px}
nav button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin-bottom:4px;border-color:transparent;background:transparent}
nav button .ic{width:22px;text-align:center;font-size:15px}
nav button.act{background:var(--pn2);border-color:var(--amb)}
nav .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin:10px 6px 4px}
main{display:flex;flex-direction:column;min-width:0}
#desc{padding:10px 14px;border-bottom:1px solid var(--ln);color:var(--dim)}
#desc b{color:var(--tx)}
#cw{flex:1;position:relative;min-height:300px}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{border-left:1px solid var(--ln);overflow:auto;padding:12px;background:var(--pn)}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:14px 0 8px}
aside h3:first-child{margin-top:0}
.ctl{margin-bottom:10px}
.ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.ctl label b{color:var(--tx);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:var(--amb)}
.ctl select,.ctl input[type=text]{width:100%;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mot{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;margin-bottom:6px;font:12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace}
.mot .h{display:flex;justify-content:space-between;color:var(--tx);font-weight:600;margin-bottom:3px}
.mot .h i{font-style:normal;width:9px;height:9px;border-radius:50%;background:#333;display:inline-block;margin-top:3px}
.mot .h i.run{background:var(--gr);box-shadow:0 0 6px var(--gr)}
.mot .k{color:var(--dim)}
.bar{height:4px;background:#0a0d12;border-radius:2px;margin-top:4px;overflow:hidden}
.bar div{height:100%;background:var(--cy)}
#log{font:11.5px/1.45 ui-monospace,Consolas,monospace;background:#0a0d12;border:1px solid var(--ln);border-radius:8px;padding:7px;height:150px;overflow:auto;color:#9fe3a8;white-space:pre-wrap}
.note{font-size:12px;color:var(--dim);background:var(--pn2);border-left:3px solid var(--amb);padding:7px 9px;border-radius:4px}
@media (max-width:900px){
 #app{grid-template-columns:1fr;height:auto}
 nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln)}
 nav button{width:auto;white-space:nowrap;margin-right:4px}
 nav .grp{display:none}
 #cw{height:58vh}
 aside{border-left:0;border-top:1px solid var(--ln)}
 header .sub{display:none}
}
</style>
<style>
#shareBtn{background:#3a2a08;border:1px solid #f5a524;color:#ffd27a;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
#shareDlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:99}
#shareDlg.open{display:flex}
#shareDlg .box{background:#141922;border:1px solid #283240;border-radius:12px;padding:18px;width:min(440px,92vw);color:#dbe2ea;font:14px system-ui,sans-serif}
#shareDlg h4{margin:0 0 4px;font-size:16px}#shareDlg p{margin:0 0 12px;color:#8d99a6;font-size:12.5px}
#shareDlg .row{display:flex;gap:6px}#shareDlg input{flex:1;background:#0a0d12;color:#dbe2ea;border:1px solid #283240;border-radius:7px;padding:7px;font:12.5px ui-monospace,Consolas,monospace}
#shareDlg button{background:#1b222d;color:#dbe2ea;border:1px solid #283240;border-radius:7px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13px}
#shareDlg button.ok{border-color:#3fb950;color:#3fb950}
#shareDlg .soc{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
#shareDlg .soc a{background:#1b222d;border:1px solid #283240;border-radius:7px;padding:6px 10px;color:#dbe2ea;text-decoration:none;font-size:13px}
#shareDlg .soc a:hover,#shareDlg button:hover{border-color:#f5a524}
</style>
</head>
<body>
<header>
 <h1><span>WolfTronix</span> Stepper Lab</h1>
 <div class="sub">4× NEMA17 · TMC2209 1/16 µstep · ESP32-S3 · DY-SV5W MP3 · Bambu X2D prints</div>
 <div class="sp"></div>
 <button id="shareBtn">🔗 Share</button>
 <button id="bPause">⏸ Pause</button>
 <button id="bSound">🔇 Sound off</button>
</header>
<div id="app">
 <nav id="nav"></nav>
 <main>
  <div id="desc"></div>
  <div id="cw"><canvas id="cv"></canvas></div>
 </main>
 <aside>
  <h3>Controls</h3>
  <div id="ctl"></div>
  <h3>Steppers</h3>
  <div id="mot"></div>
  <h3>ESP32 / DY-SV5W log</h3>
  <div id="log"></div>
 </aside>
</div>
<script>
"use strict";
// ---------- helpers ----------
const TAU=Math.PI*2, R=d=>d*Math.PI/180, D=r=>r*180/Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const wrap360=d=>((d%360)+360)%360, angDiff=(a,b)=>((a-b)%360+540)%360-180;
const C={bg:'#0d1117',pn:'#161b22',ln:'#2a3340',tx:'#d6dde6',dim:'#8b96a3',amb:'#f5a524',cy:'#39c5cf',gr:'#3fb950',rd:'#f85149',vi:'#a371f7'};

// ---------- stepper model ----------
class Stepper{
 constructor(name,o={}){
  this.name=name;this.spr=o.spr||3200;this.gear=o.gear||1;this.vmax=o.vmax||4000;this.acc=o.acc||8000;
  this.unit=o.unit||'°';this.perRev=o.perRev||360; // output units per output rev
  this.pos=0;this.v=0;this.target=0;this.mode='pos';this.speed=0;this.total=0;this.note=o.note||'';
 }
 get stepsPerUnit(){return this.spr*this.gear/this.perRev}
 moveTo(s){this.mode='pos';this.target=s}
 moveToU(u){this.moveTo(u*this.stepsPerUnit)}
 moveToWrap(d){const cur=this.target/this.stepsPerUnit;this.moveToU(cur+angDiff(d,cur))}
 run(sps){this.mode='spd';this.speed=sps}
 u(){return this.pos/this.stepsPerUnit}
 tu(){return this.target/this.stepsPerUnit}
 rpm(){return this.v/this.spr*60}
 busy(){return this.mode==='spd'?Math.abs(this.v)>1:Math.abs(this.target-this.pos)>0.5||Math.abs(this.v)>1}
 update(dt){
  let want;
  if(this.mode==='spd') want=clamp(this.speed,-this.vmax,this.vmax);
  else{const d=this.target-this.pos;
   if(Math.abs(d)<0.5&&Math.abs(this.v)<this.acc*dt*2){this.total+=Math.abs(d);this.pos=this.target;this.v=0;return}
   want=Math.sign(d)*Math.min(this.vmax,Math.sqrt(2*this.acc*Math.abs(d)));}
  const dv=clamp(want-this.v,-this.acc*dt,this.acc*dt);this.v+=dv;
  let step=this.v*dt;
  if(this.mode==='pos'){const d=this.target-this.pos;if(Math.sign(step)===Math.sign(d)&&Math.abs(step)>Math.abs(d)){step=d;}}
  this.pos+=step;this.total+=Math.abs(step);
 }
}

// ---------- audio / MP3 emulation ----------
let soundOn=false,AC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}return AC}
function tone(f,dur,o={}){if(!soundOn)return;try{const a=ac(),t=a.currentTime+(o.when||0);const os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);const v=o.vol||0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);os.connect(g).connect(a.destination);os.start(t);os.stop(t+dur+0.05)}catch(e){}}
function bell(f,when=0,vol=0.12){tone(f,2.2,{when,vol});tone(f*2.01,1.2,{when,vol:vol*0.35});tone(f*3.02,0.7,{when,vol:vol*0.15})}
let noiseBuf=null;
function clack(vol=0.25){if(!soundOn)return;try{const a=ac();if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.03,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4)}const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2500;s.buffer=noiseBuf;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}}
function say(text){if(!soundOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}
let mp3n=1;const logEl=document.getElementById('log');
function log(msg){const t=new Date().toTimeString().slice(0,8);logEl.textContent+=`[${t}] ${msg}\n`;if(logEl.textContent.length>6000)logEl.textContent=logEl.textContent.slice(-4000);logEl.scrollTop=1e9}
function mp3(desc,speak){log(`▶ DY-SV5W play /${String(mp3n++%200).padStart(5,'0')}.mp3  "${desc}"`);if(speak)say(speak)}

// ---------- UI framework ----------
const sims=[];let cur=null,paused=false;
const nav=document.getElementById('nav'),ctl=document.getElementById('ctl'),motEl=document.getElementById('mot'),descEl=document.getElementById('desc');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
const UI={
 slider(label,min,max,step,val,fn,fmt=v=>v){const d=document.createElement('div');d.className='ctl';d.innerHTML=`<label>${label}<b></b></label><input type=range min=${min} max=${max} step=${step} value=${val}>`;const i=d.querySelector('input'),b=d.querySelector('b');const up=()=>{b.textContent=fmt(+i.value);fn(+i.value)};i.oninput=up;ctl.appendChild(d);b.textContent=fmt(val);fn(val);return i},
 select(label,opts,fn,val){const d=document.createElement('div');d.className='ctl';d.innerHTML=`<label>${label}</label><select>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;const s=d.querySelector('select');if(val)s.value=val;s.onchange=()=>fn(s.value);ctl.appendChild(d);fn(s.value);return s},
 text(label,val,fn){const d=document.createElement('div');d.className='ctl';d.innerHTML=`<label>${label}</label><input type=text value="${val}">`;const i=d.querySelector('input');i.onchange=()=>fn(i.value);i.onkeyup=e=>{if(e.key==='Enter')fn(i.value)};ctl.appendChild(d);return i},
 buttons(list){const d=document.createElement('div');d.className='row';for(const [l,f] of list){const b=document.createElement('button');b.textContent=l;b.onclick=()=>f(b);d.appendChild(b)}ctl.appendChild(d);return d},
 toggle(label,val,fn){const d=document.createElement('div');d.className='row';const b=document.createElement('button');const set=v=>{val=v;b.className=v?'on':'';b.textContent=(v?'✔ ':'○ ')+label;fn(v)};b.onclick=()=>set(!val);d.appendChild(b);ctl.appendChild(d);set(val);return d},
 note(html){const d=document.createElement('div');d.className='note';d.innerHTML=html;ctl.appendChild(d)}
};
function select(i){
 cur=sims[i];[...nav.querySelectorAll('button')].forEach(b=>b.classList.toggle('act',+b.dataset.i===i));
 ctl.innerHTML='';motEl.innerHTML='';descEl.innerHTML=`<b>${cur.icon} ${cur.name}</b> — ${cur.desc}`;
 cur.motors=[];cur.ready=false;cur.init(UI);buildMot();
 log(`— ${cur.name} loaded —`);
 try{location.hash=cur.id}catch(e){}
}
function buildMot(){
 motEl.innerHTML=cur.motors.map((m,k)=>`<div class=mot><div class=h><span>M${k+1} · ${m.name}</span><i id=mi${k}></i></div><div id=mt${k} class=k></div><div class=bar><div id=mb${k}></div></div></div>`).join('');
}
let lastPanel=0;
function panel(now){if(now-lastPanel<100)return;lastPanel=now;cur.motors.forEach((m,k)=>{const e=document.getElementById('mt'+k);if(!e)return;const out=m.u();e.textContent=`pos ${Math.round(m.pos).toString().padStart(8)} st\nout ${out.toFixed(1)}${m.unit}  ${m.rpm().toFixed(1)} rpm${m.gear!==1?`\ngear ${m.gear}:1`:''}${m.note?'  '+m.note:''}`;document.getElementById('mb'+k).style.width=clamp(Math.abs(m.v)/m.vmax*100,0,100)+'%';document.getElementById('mi'+k).className=m.busy()?'run':''})}
let pointer={x:0,y:0,down:false};
function ptr(e){const r=cv.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top}
cv.addEventListener('pointerdown',e=>{ptr(e);pointer.down=true;cv.setPointerCapture(e.pointerId);cur.down&&cur.down(pointer.x,pointer.y)});
cv.addEventListener('pointermove',e=>{ptr(e);cur.move&&cur.move(pointer.x,pointer.y,pointer.down)});
cv.addEventListener('pointerup',e=>{pointer.down=false;cur.up&&cur.up()});
document.getElementById('bPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ Run':'⏸ Pause';e.target.className=paused?'on':''};
document.getElementById('bSound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 Sound on':'🔇 Sound off';e.target.className=soundOn?'on':'';if(soundOn){try{ac().resume()}catch(x){}}else{try{speechSynthesis.cancel()}catch(x){}}};
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(cur){if(!paused){cur.update(dt);cur.motors.forEach(m=>m.update(dt));cur.post&&cur.post(dt)}
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.save();cur.draw(ctx,W,H);ctx.restore();panel(now)}
 requestAnimationFrame(frame)}
function addSim(s){sims.push(s)}

// drawing helpers
function circ(x,y,r,fill,stroke,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,c,lw=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.stroke()}
function txt(s,x,y,c=C.tx,size=12,align='left',font='system-ui'){ctx.fillStyle=c;ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function mono(s,x,y,c=C.tx,size=12,align='left'){txt(s,x,y,c,size,align,'ui-monospace,Consolas,monospace')}
function rrect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
// screen angle from compass degrees (0=up, clockwise)
const cx=(x,a,r)=>x+Math.sin(R(a))*r, cy=(y,a,r)=>y-Math.cos(R(a))*r;

// =====================================================================
// 1. PLANE POINTER
// =====================================================================
addSim({id:'plane',grp:'Aviation & radio',name:'Plane Pointer',icon:'✈️',
desc:'Pan/tilt arrow tracks aircraft from ADS-B. AZ + EL steppers on printed 3:1 gears; the DY-SV5W announces each new target. Click a plane to pick it.',
init(ui){
 this.az=new Stepper('AZ pan',{gear:3,vmax:7000,acc:7000});this.el=new Stepper('EL tilt',{gear:3,vmax:5000,acc:6000});
 this.motors=[this.az,this.el];this.planes=[];this.range=30;this.ts=20;this.sel=null;this.tgt=null;this.trailT=0;
 ui.select('Target mode',['Nearest','Click to pick','Lowest altitude','Fastest'],v=>this.mode=v);
 ui.slider('Radar range',10,50,1,30,v=>this.range=v,v=>v+' km');
 ui.slider('Sim speed',1,60,1,20,v=>this.ts=v,v=>'×'+v);
 ui.slider('Aircraft',2,14,1,7,v=>{this.n=v;while(this.planes.length<v)this.planes.push(this.spawn(true));this.planes.length=v});
 ui.buttons([['New traffic',()=>{this.planes=this.planes.map(()=>this.spawn(true))}]]);
 ui.note('Home = Escondido. Real build: dump1090 / adsb.lol JSON → ESP32 → az = atan2(ΔE,ΔN), el = atan2(alt, dist). Optical end-stop homes AZ at north.');
},
spawn(any){const al=[['SWA','Southwest'],['ASA','Alaska'],['UAL','United'],['AAL','American'],['SKW','SkyWest'],['FDX','FedEx'],['N','November']];const a=pick(al);
 const ph=['alpha','bravo','charlie','delta','echo','foxtrot','golf','hotel','kilo','lima','mike','papa','romeo','sierra','tango','victor','whiskey','x-ray','yankee','zulu'];
 let cs,sp,alt,kt;if(a[0]==='N'){const n=Math.floor(rnd(100,999)),l=Math.floor(rnd(0,20));cs='N'+n+ph[l][0].toUpperCase();sp=`November ${String(n).split('').join(' ')} ${ph[l]}`;alt=rnd(2500,7500);kt=rnd(95,140)}
 else{const n=Math.floor(rnd(100,2999));cs=a[0]+n;sp=`${a[1]} ${String(n).split('').join(' ')}`;alt=rnd(4000,24000);kt=rnd(230,420)}
 const ang=rnd(0,TAU),r=any?rnd(2,this.range):this.range;const x=Math.sin(ang)*r,y=Math.cos(ang)*r;
 const hdg=any?rnd(0,360):wrap360(D(Math.atan2(-x,-y))+rnd(-40,40));
 return{cs,sp,x,y,hdg,alt,kt,dest:pick(['Lindbergh','Palomar','Montgomery','Los Angeles','Ontario','Phoenix']),trail:[]}},
update(dt){
 this.trailT+=dt;const addTrail=this.trailT>0.4;if(addTrail)this.trailT=0;
 for(let i=0;i<this.planes.length;i++){const p=this.planes[i];const v=p.kt*1.852/3600*this.ts;p.hdg=wrap360(p.hdg+rnd(-3,3)*dt);p.x+=Math.sin(R(p.hdg))*v*dt;p.y+=Math.cos(R(p.hdg))*v*dt;p.alt=clamp(p.alt+rnd(-40,40)*dt*this.ts,1500,30000);
  if(addTrail){p.trail.push([p.x,p.y]);if(p.trail.length>25)p.trail.shift()}
  if(Math.hypot(p.x,p.y)>this.range*1.15)this.planes[i]=this.spawn(false)}
 let t=null;const pl=this.planes;const d3=p=>Math.hypot(p.x,p.y,p.alt*0.0003048);
 if(this.mode==='Click to pick'){t=pl.includes(this.sel)?this.sel:null}
 else if(this.mode==='Lowest altitude')t=pl.reduce((a,b)=>!a||b.alt<a.alt?b:a,null);
 else if(this.mode==='Fastest')t=pl.reduce((a,b)=>!a||b.kt>a.kt?b:a,null);
 else t=pl.reduce((a,b)=>!a||d3(b)<d3(a)?b:a,null);
 if(t!==this.tgt){this.tgt=t;if(t){const dist=Math.hypot(t.x,t.y);mp3(`${t.cs} ${Math.round(t.alt/100)*100} ft ${dist.toFixed(1)} km → ${t.dest}`,`${t.sp}, ${Math.round(t.alt/100)*100} feet, ${dist.toFixed(0)} kilometers, inbound ${t.dest}`)}}
 if(t){const dist=Math.hypot(t.x,t.y);this.cmdAz=wrap360(D(Math.atan2(t.x,t.y)));this.cmdEl=clamp(D(Math.atan2(t.alt*0.0003048,dist)),0,89);this.az.moveToWrap(this.cmdAz);this.el.moveToU(this.cmdEl)}
},
down(x,y){if(this.mode!=='Click to pick')return;let best=null,bd=30;for(const p of this.planes){const sx=this.mx+p.x*this.ms,sy=this.my-p.y*this.ms;const d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=p}}if(best)this.sel=best},
draw(c,W,H){
 const mw=Math.min(W*0.62,H)-20;this.mx=10+mw/2;this.my=H/2;this.ms=mw/2/this.range;const mx=this.mx,my=this.my,ms=this.ms;
 circ(mx,my,mw/2,'#0a1a12',C.ln);
 for(let r=10;r<=this.range;r+=10){circ(mx,my,r*ms,null,'#1f3a2a');txt(r+' km',mx+3,my-r*ms+8,'#3d6b50',10)}
 for(let a=0;a<360;a+=30)line(mx,my,cx(mx,a,mw/2),cy(my,a,mw/2),'#14281d');

actualXY(){const A=this.a.u(),B=this.b.u();return this.kin==='CoreXY'?[(A+B)/2,(A-B)/2]:[A,B]},
update(dt){if(!this.strokes)return;const settle=Math.abs(this.z.target-this.z.pos)<1;
 if(this.si>=this.strokes.length){this.z.moveToU(0);if(!this.doneLog){this.doneLog=true;mp3('plot finished',`Plot finished.`)}return}this.doneLog=false;
 const st=this.strokes[this.si];
 if(this.phase==='travel'){this.z.moveToU(0);if(!settle)return;const tg=st[0];if(this.goto(tg,this.feed*3,dt)){this.phase='down';}}
 else if(this.phase==='down'){this.z.moveToU(4);if(settle&&Math.abs(this.z.u()-4)<0.05){this.phase='draw';this.pi=1}}
 else if(this.phase==='draw'){let budget=this.feed*dt;while(budget>0&&this.pi<st.length){const tg=st[this.pi];const [x,y]=this.tool;const d=Math.hypot(tg[0]-x,tg[1]-y);if(d<=budget){this.setXY(tg[0],tg[1]);budget-=d;this.pi++;this.drawn++}else{this.setXY(x+(tg[0]-x)/d*budget,y+(tg[1]-y)/d*budget);budget=0}}if(this.pi>=st.length){this.phase='up'}}
 else if(this.phase==='up'){this.z.moveToU(0);if(settle){this.si++;this.phase='travel'}}},
goto(tg,f,dt){const [x,y]=this.tool;const d=Math.hypot(tg[0]-x,tg[1]-y),st=f*dt;if(d<=st){this.setXY(tg[0],tg[1]);const [ax,ay]=this.actualXY();return Math.hypot(ax-tg[0],ay-tg[1])<0.3}this.setXY(x+(tg[0]-x)/d*st,y+(tg[1]-y)/d*st);return false},
draw(c,W,H){if(!this.strokes)this.load('WOLF');const s=Math.min((W-80)/this.Wp,(H-90)/this.Hp);const ox=(W-this.Wp*s)/2,oy=40;
 const iw=Math.ceil(this.Wp*s),ih=Math.ceil(this.Hp*s);if(this.ink.width!==iw||this.ink.height!==ih){this.ink.width=iw;this.ink.height=ih;this.sc=s;this.prevXY=null}
 const [x,y]=this.actualXY();const pd=this.z.u()>3.5;if(pd&&this.prevXY){const g=this.ink.getContext('2d');g.strokeStyle='#1a3a8c';g.lineWidth=1.6;g.lineCap='round';g.beginPath();g.moveTo(this.prevXY[0]*this.sc,this.prevXY[1]*this.sc);g.lineTo(x*this.sc,y*this.sc);g.stroke()}this.prevXY=[x,y];
 rrect(ox-24,oy-24,this.Wp*s+48,this.Hp*s+48,8,'#1a1f27',C.ln);ctx.fillStyle='#f7f5ef';ctx.fillRect(ox,oy,this.Wp*s,this.Hp*s);ctx.drawImage(this.ink,ox,oy,this.Wp*s,this.Hp*s);
 // preview faint
 ctx.globalAlpha=0.12;this.strokes.forEach(st=>{ctx.beginPath();st.forEach(([px,py],i)=>i?ctx.lineTo(ox+px*s,oy+py*s):ctx.moveTo(ox+px*s,oy+py*s));ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke()});ctx.globalAlpha=1;
 // gantry
 const gx=ox+x*s,gy=oy+y*s;rrect(ox-20,gy-6,this.Wp*s+40,12,3,'rgba(80,90,105,.85)');rrect(gx-6,oy-22,12,this.Hp*s+44,3,'rgba(80,90,105,.5)');circ(gx,gy,pd?5:9,pd?'#1a3a8c':'rgba(26,58,140,.35)',C.amb,2);
 mono(`X ${x.toFixed(1)}  Y ${y.toFixed(1)}  Z ${this.z.u().toFixed(1)}  ${pd?'PEN DOWN':'pen up'}   ${this.kin}${this.kin==='CoreXY'?'  (A=X+Y, B=X−Y)':''}   ${Math.round(this.drawn/this.tot*100)}%`,W/2,H-22,C.tx,12,'center')}
});

// 13. PET FEEDER
// =====================================================================
addSim({id:'feeder',grp:'Shop tools',name:'Pet Feeder (auger)',icon:'🐱',
desc:'A printed auger on a NEMA17 meters out kibble on a schedule. StallGuard detects a jam and reverses to clear it, and the MP3 calls the cat for dinner.',
init(ui){this.m=new Stepper('Auger',{unit:' rev',perRev:1,vmax:1600,acc:3000});this.motors=[this.m];this.gpr=8;this.hopper=900;this.bowl=0;this.parts=[];this.t=6.9*3600;this.feeding=false;this.lastMeal=-1;this.jamT=0;
 ui.slider('Clock speed',1,1200,1,600,v=>this.ts=v,v=>'×'+v);ui.slider('Portion',10,80,5,40,v=>this.por=v,v=>v+' g');ui.toggle('Jam simulation',true,v=>this.jam=v);
 ui.buttons([['Feed now',()=>this.feed('Snack')],['Refill hopper',()=>{this.hopper=900;log('hopper refilled 900 g')}]]);ui.note('Schedule: 07:00 breakfast · 12:30 lunch · 18:00 dinner. Calibrated at 8 g per auger revolution.')},
feed(name){if(this.hopper<=0){mp3('hopper empty alert','Feeder empty. Please refill.');return}const revs=this.por/this.gpr;this.m.moveTo(this.m.target+revs*this.m.spr);this.feeding=true;this.jammed=false;mp3(name+' chime',`${name} time! Here kitty kitty!`);tone(880,0.15);tone(1175,0.2,{when:0.18})},
update(dt){this.t+=dt*this.ts;const day=this.t%86400;const meals=[[7*3600,'Breakfast'],[12.5*3600,'Lunch'],[18*3600,'Dinner']];
 meals.forEach(([mt,n],i)=>{const key=Math.floor(this.t/86400)*10+i;if(day>=mt&&day<mt+600*Math.max(1,this.ts/60)&&this.lastMeal<key){this.lastMeal=key;this.feed(n)}});
 if(this.feeding&&this.jam&&!this.jammed&&Math.random()<dt*0.25&&this.m.v>200){this.jammed=true;const back=this.m.pos-0.5*this.m.spr;this.resume=this.m.target;this.m.moveTo(back);log('⚠ StallGuard SG_RESULT<60 → jam! reversing ½ rev');tone(300,0.2,{type:'square',vol:0.05})}
 if(this.jammed&&!this.m.busy()){this.jammed=false;this.m.moveTo(this.resume);log('jam cleared, resuming')}
 const dg=Math.max(0,this.m.v)*dt/this.m.spr*this.gpr;if(dg>0&&this.hopper>0){this.hopper-=dg;for(let i=0;i<dg*1.5;i++)this.parts.push({x:rnd(-6,6),y:0,vy:rnd(0,30)})}
 if(this.feeding&&!this.m.busy()){this.feeding=false;log(`portion delivered ✓ hopper ${this.hopper.toFixed(0)} g`)}
 for(const p of this.parts){p.vy+=400*dt;p.y+=p.vy*dt}const before=this.parts.length;this.parts=this.parts.filter(p=>p.y<this.fall);this.bowl+=(before-this.parts.length)/1.5;
 this.bowl=Math.max(0,this.bowl-dt*this.ts*0.004)},
draw(c,W,H){const s=Math.min(W/620,H/440);ctx.save();ctx.translate((W-620*s)/2,(H-440*s)/2);ctx.scale(s,s);this.fall=150;
 // hopper
 ctx.beginPath();ctx.moveTo(60,30);ctx.lineTo(260,30);ctx.lineTo(200,170);ctx.lineTo(120,170);ctx.closePath();ctx.fillStyle='#1a2029';ctx.fill();ctx.strokeStyle=C.ln;ctx.lineWidth=2;ctx.stroke();
 const lv=clamp(this.hopper/900,0,1);ctx.save();ctx.clip();ctx.fillStyle='#8a5a2b';ctx.fillRect(40,170-lv*140,240,lv*140);for(let i=0;i<80*lv;i++){circ(70+((i*37)%180),170-((i*53)%Math.max(1,lv*140)),4,'#a8743d')}ctx.restore();txt(`hopper ${Math.max(0,this.hopper).toFixed(0)} g`,160,15,C.dim,13,'center');
 // auger tube
 rrect(100,170,330,44,10,'#222a33',C.ln);const ph=this.m.u()*TAU;ctx.save();ctx.beginPath();ctx.rect(104,174,322,36);ctx.clip();for(let x=90;x<440;x+=22){const off=((ph/TAU)*22)%22;const xx=x+off;line(xx,174,xx-14,210,'#c9d1d9',3)}ctx.restore();
 rrect(60,176,40,32,4,'#333',C.amb);txt('M',80,192,C.amb,13,'center');
 // chute
 rrect(406,214,28,40,3,'#222a33',C.ln);
 // particles
 ctx.save();ctx.translate(420,254);for(const p of this.parts)circ(p.x,p.y,3.5,'#a8743d');ctx.restore();
 // bowl
 const bx=420,by=410;ctx.beginPath();ctx.ellipse(bx,by-30,70,16,0,0,TAU);ctx.fillStyle='#2f6fd6';ctx.fill();ctx.beginPath();ctx.moveTo(bx-70,by-30);ctx.lineTo(bx-52,by);ctx.lineTo(bx+52,by);ctx.lineTo(bx+70,by-30);ctx.fillStyle='#2457ab';ctx.fill();
 const f=clamp(this.bowl/80,0,1);for(let i=0;i<f*60;i++)circ(bx-55+((i*29)%110),by-30-((i*13)%Math.max(1,f*14)),4,'#a8743d');
 txt(this.bowl>3?'😺':'🐱',bx+130,by-40,C.tx,54,'center');txt(`bowl ${this.bowl.toFixed(0)} g`,bx,by+18,C.dim,13,'center');
 // clock
 const d=this.t%86400;mono(`${String(Math.floor(d/3600)).padStart(2,'0')}:${String(Math.floor(d/60)%60).padStart(2,'0')}`,40,300,C.amb,40);mono(this.jammed?'JAM — reversing':this.feeding?'FEEDING…':'idle',40,340,this.jammed?C.rd:this.feeding?C.gr:C.dim,16);
 const nxt=[[7,'07:00 breakfast'],[12.5,'12:30 lunch'],[18,'18:00 dinner']].find(([h])=>h*3600>d)||[7,'07:00 breakfast'];mono('next: '+nxt[1],40,370,C.tx,14);ctx.restore()}
});
